<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem - RPG Total</title>
    <style>
        /* === FONTES E ESTILO VISUAL === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto:wght@500;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Lora', serif; 
            background-color: #170f0a; 
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicij-pbyNJBmSq1lNLeur-8lJkGfzOOurAvNt5ruR5j2KHWV9Qvqa90urImliVnN1Nvwm5ho0jTfeeNNjeUuSG-VDox7XojiJXx-6-2k4TJ5Or2PkHgGFgFwI4-ineXJaBO8nnt6Q9uchp7TobVp8W-HUKqTWhSU3Sg-uJFxZdvlYDy0kep7xEh0SrU5xt/w1519-h855/Gemini_Generated_Image_k9b6nuk9b6nuk9b6.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #3e2723; display: flex; justify-content: center; padding: 30px 15px; margin: 0; min-height: 100vh;
            overflow-x: hidden;
        }

        /* === CONTAINER DA FICHA === */
        .ficha-container {
            background-color: rgba(244, 235, 216, 0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 40px; border-radius: 4px; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            width: 100%; max-width: 1200px; border: 3px solid #8b5a2b; outline: 5px solid rgba(92, 58, 33, 0.8); outline-offset: -12px; position: relative;
        }

        .section-title { font-family: 'Cinzel', serif; color: #5c3a21; font-size: 1.4rem; margin-bottom: 25px; text-transform: uppercase; border-bottom: 2px solid rgba(139, 90, 43, 0.4); padding-bottom: 10px; text-align: center; font-weight: 800; }

        /* === CABEÇALHO === */
        .header-rpg-container { display: flex; gap: 25px; align-items: flex-start; margin-bottom: 35px; }
        .portrait-slot {
            width: 140px; height: 180px; border: 6px solid #3e2723; outline: 3px solid #8b5a2b; outline-offset: -3px; border-radius: 4px;
            background: rgba(0,0,0,0.3); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); transition: 0.3s;
        }
        #portrait-img { width: 100%; height: 100%; object-fit: cover; }
        .header-info-grid { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .header-row { display: flex; gap: 20px; width: 100%; }
        .campo-rpg { display: flex; flex-direction: column; flex: 1; }
        .campo-rpg input, .campo-rpg select { border: 2px solid #000; font-weight: 900; font-size: 1.1rem; padding: 0 12px; height: 42px; width: 100%; background: rgba(255, 255, 255, 0.8); color: #000; }
        .campo-rpg label { font-family: 'Roboto', sans-serif; font-size: 0.75rem; color: #3e2723; font-weight: 900; text-transform: uppercase; margin-top: 4px; margin-left: 5px; }

        /* === NAVEGAÇÃO === */
        .tabs-nav { display: flex; gap: 12px; margin-bottom: 30px; border-bottom: 3px solid #8b5a2b; flex-wrap: wrap; }
        .tab-btn { background: rgba(234, 221, 197, 0.9); border: 2px solid #8b5a2b; padding: 12px 25px; cursor: pointer; font-family: 'Cinzel', serif; font-weight: 800; color: #5c3a21; border-radius: 10px 10px 0 0; transition: 0.2s; }
        .tab-btn.active { background: #b71c1c; color: #fff; border-bottom: 3px solid #b71c1c; }

        /* === ATRIBUTOS === */
        .sidebar-atributos { flex: 0 0 110px; display: flex; flex-direction: column; gap: 15px; }
        .atributo-box { background-color: rgba(234, 221, 197, 0.9); padding: 10px; border-radius: 45px 12px 45px 12px; text-align: center; border: 2px solid #8b5a2b; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .atributo-box label { font-family: 'Cinzel', serif; font-weight: 800; cursor: pointer; color: #5c3a21; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        .atributo-box input { width: 100%; text-align: center; font-size: 1.6rem; font-weight: 900; border: none; background: transparent; color: #000; }

        /* === BARRAS DE STATUS === */
        .status-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-bottom: 35px; padding: 20px; border-top: 2px dashed #8b5a2b; border-bottom: 2px dashed #8b5a2b; }
        .status-module { display: flex; align-items: center; gap: 15px; background: rgba(234, 221, 197, 0.6); padding: 15px 20px; border-radius: 15px; border: 1px solid rgba(139, 90, 43, 0.4); flex: 1; min-width: 320px; }
        .circle-icon { width: 50px; height: 50px; background: #3e2723; color: #f4ebd8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel'; font-weight: 900; border: 3px solid #000; font-size: 1.2rem; }
        .glass-track { width: 160px; height: 35px; background: rgba(0,0,0,0.2); border: 3px solid #000; border-radius: 25px; position: relative; overflow: hidden; }
        .liquid-fill { height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .vida-color { background-color: #b71c1c; box-shadow: inset 0 0 15px rgba(255,255,255,0.3); }
        .mana-color { background-color: #0d47a1; box-shadow: inset 0 0 15px rgba(255,255,255,0.3); }
        .atual-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; border: none; text-align: center; color: #fff; font-size: 1.3rem; font-weight: 900; text-shadow: 1px 1px 2px #000; z-index: 5; }

        /* === PERÍCIAS === */
        .pericias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .pericia-card { background-color: rgba(255,255,255,0.5); border: 2px solid #8b5a2b; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; transition: 0.2s; cursor: pointer; }
        .pericia-card.treinado { border-color: #b71c1c; background-color: rgba(183, 28, 28, 0.1); }
        .pericia-header { font-family: 'Cinzel', serif; font-weight: 800; font-size: 0.8rem; text-align: center; color: #3e2723; text-transform: uppercase; }
        .pericia-roll-box { width: 100%; border: 1px solid #8b5a2b; border-radius: 4px; padding: 5px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: 900; margin-top: 8px; background: rgba(0,0,0,0.05); }

        /* === DADOS POP-UP === */
        #dice-overlay-click { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1999; cursor: pointer; display: none; background: rgba(0,0,0,0.2); }
        #dice-result-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.6); opacity: 0;
            background: #fff; border: 5px solid #b71c1c; padding: 30px 50px; border-radius: 20px;
            z-index: 2000; text-align: center; pointer-events: none; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        #dice-result-container.dice-pop-active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .pop-total { font-size: 5rem; font-weight: 900; line-height: 1; font-family: 'Cinzel'; margin-bottom: 10px; display: block; color: #3e2723; }
        .pop-categoria-badge { color: #fff; padding: 6px 18px; border-radius: 8px; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* === MAGIAS E CIRCULOS === */
        .magia-circulo-section { margin-bottom: 30px; }
        .magia-circulo-title { font-family: 'Cinzel'; color: #b71c1c; font-size: 1.4rem; font-weight: 900; border-bottom: 3px double #b71c1c; padding-bottom: 8px; margin-bottom: 15px; text-shadow: 1px 1px 0px #fff; }

        /* === MODAIS === */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(5px); }
        .modal-content { background: #f4ebd8; border: 3px solid #8b5a2b; padding: 30px; width: 95%; max-width: 550px; border-radius: 6px; max-height: 90vh; overflow-y: auto; }
        .form-input { width: 100%; padding: 12px; border: 2px solid #3e2723; background: #fff; font-weight: 900; margin-bottom: 15px; font-size: 1rem; }
        .btn-salvar { width: 100%; background: #5c3a21; color: #fff; padding: 15px; cursor: pointer; border: none; font-family: 'Cinzel'; font-weight: 900; font-size: 1.1rem; border-radius: 4px; }
        .btn-salvar:hover { background: #b71c1c; }

        /* === LISTAS LATERAIS === */
        .list-section { padding: 10px 0; border-top: 1px solid rgba(139, 90, 43, 0.4); margin-bottom: 20px; }
        .item-btn { background: rgba(234, 221, 197, 0.9); border-left: 5px solid #8b5a2b; border-bottom: 1px solid #ccc; padding: 12px; margin-bottom: 8px; cursor: pointer; width: 100%; text-align: left; font-weight: 900; font-family: 'Lora'; display: flex; justify-content: space-between; }
        .item-btn:hover { background: #fff; }

        @media (max-width: 1000px) { .main-layout { flex-direction: column; } .sidebar-direita, .sidebar-atributos { width: 100%; } }
    </style>
</head>
<body>

<div id="dice-overlay-click"></div>
<div id="dice-result-container"><div id="dice-text"></div></div>

<div class="ficha-container">
    <div class="header-rpg-container">
        <div class="portrait-slot" onclick="document.getElementById('header-file-input').click()">
            <img id="portrait-img" src="" style="display: none;">
            <div id="portrait-placeholder" style="font-size: 4rem; color: #8b5a2b;">📷</div>
            <input type="file" id="header-file-input" accept="image/*" style="display: none;" onchange="loadHeaderPortrait(this)">
        </div>

        <div class="header-info-grid">
            <div class="header-row">
                <div class="campo-rpg" style="flex: 2;"><input type="text" id="char-name-input" oninput="sincronizarComMestre()"><label>Personagem</label></div>
                <div class="campo-rpg" style="flex: 1;"><input type="text" id="player-name-input" oninput="sincronizarComMestre()"><label>Jogador(a)</label></div>
                <div class="campo-rpg" style="max-width: 150px;"><input type="text" id="uid-input" placeholder="..." readonly><label>UID da Sala</label></div>
            </div>
            <div class="header-row">
                <div class="campo-rpg"><input type="text"><label>Raça</label></div>
                <div class="campo-rpg"><input type="text"><label>Classe / Origem</label></div>
                <div class="campo-rpg" style="max-width: 80px;">
                    <select id="nivel" onchange="recalcularTudo()">
                        <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
                    </select>
                    <label>Nível</label>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs-nav">
        <button class="tab-btn active" onclick="mudarAbaPrincipal('tab-principal', this)">ESTATÍSTICAS</button>
        <button class="tab-btn" onclick="mudarAbaPrincipal('tab-inventario', this)">MOCHILA / MUNDO</button>
        <button class="tab-btn" onclick="mudarAbaPrincipal('tab-magias', this)">GRIMÓRIO</button>
    </div>

    <div id="tab-principal" class="tab-content active">
        <div class="main-layout">
            <div class="sidebar-atributos">
                <div class="atributo-box"><label onclick="rolarDado('FOR', getValor('forca'))">FOR</label><input type="number" id="forca" value="0" oninput="recalcularTudo()"></div>
                <div class="atributo-box"><label onclick="rolarDado('AGI', getValor('agilidade'))">AGI</label><input type="number" id="agilidade" value="0" oninput="recalcularTudo()"></div>
                <div class="atributo-box"><label onclick="rolarDado('VIG', getValor('vigor'))">VIG</label><input type="number" id="vigor" value="0" oninput="recalcularTudo()"></div>
                <div class="atributo-box"><label onclick="rolarDado('INT', getValor('intelecto'))">INT</label><input type="number" id="intelecto" value="0" oninput="recalcularTudo()"></div>
                <div class="atributo-box"><label onclick="rolarDado('SAB', getValor('sabedoria'))">SAB</label><input type="number" id="sabedoria" value="0" oninput="recalcularTudo()"></div>
                <div class="atributo-box"><label onclick="rolarDado('CAR', getValor('carisma'))">CAR</label><input type="number" id="carisma" value="0" oninput="recalcularTudo()"></div>
            </div>

            <div class="conteudo-principal">
                <div class="status-container">
                    <div class="status-module">
                        <div class="circle-icon">PV</div>
                        <div class="bar-wrapper">
                            <span class="bar-title" style="font-weight:900; font-size:0.7rem; margin-left:35px;">PONTOS DE VIDA</span>
                            <div class="bar-capsule" style="display:flex; align-items:center; gap:10px;">
                                <button class="btn-status" onclick="alterarStatus('vida-atual', -1)">-</button>
                                <div class="glass-track">
                                    <div id="vida-fill" class="liquid-fill vida-color"></div>
                                    <input type="number" id="vida-atual" value="10" class="atual-input" oninput="atualizarBarras()">
                                </div>
                                <button class="btn-status" onclick="alterarStatus('vida-atual', 1)">+</button>
                                <div style="text-align:center;"><label style="font-size:0.6rem; font-weight:900; display:block;">MÁX</label><input type="number" id="vida-max" value="10" style="width:40px; height:40px; border-radius:50%; border:2px solid #000; text-align:center; font-weight:900;" oninput="atualizarBarras()"></div>
                            </div>
                        </div>
                    </div>
                    <div class="status-module">
                        <div class="circle-icon">PM</div>
                        <div class="bar-wrapper">
                            <span class="bar-title" style="font-weight:900; font-size:0.7rem; margin-left:35px;">PONTOS DE MANA</span>
                            <div class="bar-capsule" style="display:flex; align-items:center; gap:10px;">
                                <button class="btn-status" onclick="alterarStatus('mana-atual', -1)">-</button>
                                <div class="glass-track">
                                    <div id="mana-fill" class="liquid-fill mana-color"></div>
                                    <input type="number" id="mana-atual" value="10" class="atual-input" oninput="atualizarBarras()">
                                </div>
                                <button class="btn-status" onclick="alterarStatus('mana-atual', 1)">+</button>
                                <div style="text-align:center;"><label style="font-size:0.6rem; font-weight:900; display:block;">MÁX</label><input type="number" id="mana-max" value="10" style="width:40px; height:40px; border-radius:50%; border:2px solid #000; text-align:center; font-weight:900;" oninput="atualizarBarras()"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <h3 class="section-title">Perícias & Treinamentos</h3>
                <div class="pericias-grid" id="grid-pericias"></div>
            </div>

            <div class="sidebar-direita">
                <div class="defesa-box" style="background:#cfd8dc; border:3px solid #455a64; border-radius:10px; padding:15px; text-align:center; margin-bottom:25px;">
                    <label style="font-family:'Cinzel'; font-weight:900; color:#455a64;">DEFESA</label>
                    <input type="number" value="10" style="width:100%; background:transparent; border:none; text-align:center; font-size:2.5rem; font-weight:900;" oninput="sincronizarComMestre()">
                </div>
                <div class="list-section">
                    <h3 class="section-title" style="font-size:1rem;">HABILIDADES</h3>
                    <div id="lista-habilidades"></div>
                    <button class="btn-salvar" style="padding:8px; font-size:0.8rem;" onclick="abrirModalHab()">+ NOVA HABILIDADE</button>
                </div>
                <div class="list-section">
                    <h3 class="section-title" style="font-size:1rem; color:#b71c1c;">ARMAS EQUIPADAS</h3>
                    <div id="lista-armas-equipadas"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-inventario" class="tab-content">
        <div class="main-layout">
            <div class="conteudo-principal">
                <div class="inv-top-bar">
                    <div class="carga-container">
                        <span class="carga-texto">ESPAÇOS: <span id="carga-atual">0</span> / <span id="carga-max">10</span></span>
                        <div class="carga-barra-bg" style="width:100%; height:15px; background:#ddd; border:2px solid #000; border-radius:10px; margin-top:10px; overflow:hidden;">
                            <div id="carga-fill" style="height:100%; width:0%; background:#2e7d32; transition:0.3s;"></div>
                        </div>
                    </div>
                    <div class="moedas-container">
                        <span class="moedas-title">TIBARES (T$)</span>
                        <input type="number" id="moedas-atual" value="0" class="form-input" style="text-align:center; margin:0; font-size:1.5rem;" oninput="recalcularTudo()">
                    </div>
                </div>
                <div style="text-align:center; margin-top:25px;"><button class="btn-salvar" onclick="abrirModalInv()">+ ADICIONAR ITEM / EQUIPAMENTO</button></div>
                <div id="grid-inventario" class="pericias-grid" style="margin-top:25px;"></div>
            </div>
            <div class="sidebar-direita">
                <div class="list-section"><h3>GUILDAS</h3><div id="lista-guildas"></div><button class="btn-salvar" style="padding:5px;" onclick="abrirModalLista('guilda')">+ NOVA GUILDA</button></div>
                <div class="list-section"><h3>NPCs / CONTATOS</h3><div id="lista-pessoas"></div><button class="btn-salvar" style="padding:5px;" onclick="abrirModalLista('pessoa')">+ NOVO NPC</button></div>
                <div class="list-section"><h3>LOCAIS</h3><div id="lista-locais"></div><button class="btn-salvar" style="padding:5px;" onclick="abrirModalLista('local')">+ NOVO LOCAL</button></div>
            </div>
        </div>
    </div>

    <div id="tab-magias" class="tab-content">
        <div style="text-align:center; margin-bottom:30px;"><button class="btn-salvar" style="max-width:300px;" onclick="abrirModalMagia()">+ APRENDER NOVA MAGIA</button></div>
        <div id="magias-container"></div>
    </div>
</div>

<div id="modal-inventario" class="modal-overlay"><div class="modal-content"><span class="fechar-modal" onclick="fecharModais()">&times;</span><h3 class="section-title">Novo Item</h3>
    <div class="modal-tabs" style="display:flex; justify-content:space-around; margin-bottom:15px; border-bottom:1px solid #8b5a2b;">
        <button class="modal-tab-btn active" id="tab-comum" onclick="mudarAbaItem('comum')">COMUM</button>
        <button class="modal-tab-btn" id="tab-corpo" onclick="mudarAbaItem('corpo')">C. CORPO</button>
        <button class="modal-tab-btn" id="tab-dist" onclick="mudarAbaItem('dist')">DISTÂNCIA</button>
        <button class="modal-tab-btn" id="tab-municao" onclick="mudarAbaItem('municao')">MUNIÇÃO</button>
    </div>
    <input type="text" id="mi-nome" placeholder="Nome do Item" class="form-input">
    <input type="number" id="mi-peso" placeholder="Peso (Espaços)" value="1" step="0.5" class="form-input">
    <div id="arma-campos" style="display:none;">
        <input type="text" id="mi-dano" placeholder="Dano (ex: 2d6)" class="form-input">
        <input type="text" id="mi-crit" placeholder="Crítico (ex: 19/x3)" class="form-input">
    </div>
    <div id="mun-campos" style="display:none;"><input type="text" id="mi-mun-link" placeholder="Nome da Munição que consome" class="form-input"></div>
    <textarea id="mi-desc" placeholder="Descrição e detalhes..." class="form-input" style="height:100px;"></textarea>
    <button class="btn-salvar" onclick="salvarItemInv()">SALVAR NA MOCHILA</button>
</div></div>

<div id="modal-magia-add" class="modal-overlay"><div class="modal-content"><span class="fechar-modal" onclick="fecharModais()">&times;</span><h3 class="section-title"> Grimório</h3>
    <input type="text" id="mm-nome" placeholder="Nome da Magia" class="form-input">
    <select id="mm-circulo" class="form-input"><option value="1">1º Círculo</option><option value="2">2º Círculo</option><option value="3">3º Círculo</option><option value="4">4º Círculo</option></select>
    <textarea id="mm-desc" placeholder="Efeito, custo e duração..." class="form-input" style="height:150px;"></textarea>
    <button class="btn-salvar" onclick="salvarMagia()">APRENDER MAGIA</button>
</div></div>

<div id="modal-view" class="modal-overlay"><div class="modal-content"><span class="fechar-modal" onclick="fecharModais()">&times;</span><h3 class="section-title" id="mv-nome"></h3>
    <div id="mv-actions-dist" style="display:none; text-align:center; margin-bottom:20px;">
        <button class="btn-salvar" onclick="dispararArma()">💥 DISPARAR (Gastar 1 munição)</button>
        <button class="btn-salvar" onclick="recarregarArma()" style="background:#0d47a1; margin-top:10px;">🔄 RECARREGAR (MÁX)</button>
    </div>
    <p id="mv-desc" style="white-space:pre-wrap; background:rgba(255,255,255,0.6); padding:20px; border-radius:4px; font-weight:bold;"></p>
    <button class="btn-salvar btn-apagar" onclick="apagarItemAberto()">DELETAR REGISTRO</button>
</div></div>

<div id="modal-listas" class="modal-overlay"><div class="modal-content"><span class="fechar-modal" onclick="fecharModais()">&times;</span><h3 class="section-title" id="ml-titulo">Novo</h3><input type="text" id="ml-nome" placeholder="Nome" class="form-input"><textarea id="ml-desc" placeholder="Descrição..." class="form-input"></textarea><button class="btn-salvar" onclick="salvarListaExtra()">SALVAR</button></div></div>
<div id="modal-hab" class="modal-overlay"><div class="modal-content"><span class="fechar-modal" onclick="fecharModais()">&times;</span><h3 class="section-title">Nova Habilidade</h3><input type="text" id="mh-nome" placeholder="Nome" class="form-input"><textarea id="mh-desc" placeholder="Descrição..." class="form-input"></textarea><button class="btn-salvar" onclick="salvarHab()">SALVAR</button></div></div>

<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();
    let meuUID = "";

    // Socket Connection
    socket.emit('criarFicha');
    socket.on('uidGerada', (uid) => { meuUID = uid; document.getElementById('uid-input').value = uid; });

    const DADO_IMG_URL = "https://blogger.googleusercontent.com/img/a/AVvXsEiftVk-yKnWxfthjGdnwF6awfHwHWNWsmhyKK4zNCLhhQkGaZrFRK6ccqywzrKpCZfj5XjphjWdPu0SlYHO1P4V3qxS1IOODUZ57HsAF8L5MhsYp-TUmIWnzJW97I18ccNp0DwiT6yoAL7acHi-cWVd0gAOFLAzGbaWFhuF9jwM5P9iJUs2S04wU8Xern4Y";
    
    // Banco de Dados das Perícias
    const listaPericiasBase = [
        {n:'Acrobacia',a:'agilidade'},{n:'Adestramento',a:'carisma'},{n:'Arcanismo',a:'intelecto'},{n:'Atletismo',a:'forca'},{n:'Atuação',a:'carisma'},
        {n:'Cavalgar',a:'agilidade'},{n:'Conhecimento',a:'intelecto'},{n:'Cura',a:'sabedoria'},{n:'Diplomacia',a:'carisma'},{n:'Enganação',a:'carisma'},
        {n:'Fortitude',a:'vigor'},{n:'Furtividade',a:'agilidade'},{n:'Guerra',a:'intelecto'},{n:'Iniciativa',a:'agilidade'},{n:'Intimidação',a:'carisma'},
        {n:'Intuição',a:'sabedoria'},{n:'Investigação',a:'intelecto'},{n:'Jogatina',a:'carisma'},{n:'Ladinagem',a:'agilidade'},{n:'Luta',a:'forca'},
        {n:'Misticismo',a:'intelecto'},{n:'Nobreza',a:'intelecto'},{n:'Percepção',a:'sabedoria'},{n:'Pilotagem',a:'agilidade'},{n:'Pontaria',a:'agilidade'},
        {n:'Reflexos',a:'agilidade'},{n:'Religião',a:'sabedoria'},{n:'Sobrevivência',a:'sabedoria'},{n:'Vontade',a:'sabedoria'}
    ];
    
    let dbPericias = {}; 
    listaPericiasBase.forEach(p => dbPericias[p.n] = {treinado: false, total: 0});
    
    let dbInventario = [], dbHabilidades = [], dbGuildas = [], dbPessoas = [], dbLocais = [], dbMagias = [];
    let tipoContexto = '', itemAbertoId = null, diceState = 0;

    // === SISTEMA DE SINCRONIZAÇÃO (FIXED) ===
    function sincronizarComMestre() {
        const pImg = document.getElementById('portrait-img');
        const dados = {
            charName: document.getElementById('char-name-input').value,
            playerName: document.getElementById('player-name-input').value,
            hpAtual: getValor('vida-atual'), hpMax: getValor('vida-max'),
            mpAtual: getValor('mana-atual'), mpMax: getValor('mana-max'),
            nivel: document.getElementById('nivel').value,
            defesa: document.querySelector('.defesa-box input').value,
            img: pImg.style.display !== 'none' ? pImg.src : ""
        };
        socket.emit('atualizarDados', { uid: meuUID, dados: dados });
    }

    // === SISTEMA DE DADOS ANIMADO COM CATEGORIAS (FIXED) ===
    function rolarDado(nome, bonus) {
        if(diceState !== 0) return;
        diceState = 1;
        const box = document.getElementById('dice-result-container');
        const overlay = document.getElementById('dice-overlay-click');
        box.style.display = 'block'; overlay.style.display = 'block';
        box.classList.add('dice-pop-active');

        let frames = 0;
        let anim = setInterval(() => {
            let t = Math.floor(Math.random() * 20) + 1;
            document.getElementById('dice-text').innerHTML = `<img src="${DADO_IMG_URL}" style="width:50px;"><br><span style="font-weight:900; color:#5c3a21;">${nome}</span><br><span class="pop-total">${t + bonus}</span>`;
            if(++frames > 15) {
                clearInterval(anim);
                const d20 = Math.floor(Math.random() * 20) + 1;
                const total = d20 + bonus;
                let cat = "NORMAL", cor = "#3e2723";

                if(d20 === 20) { cat = "CRÍTICO!"; cor = "#ff9100"; }
                else if(d20 === 1) { cat = "DESASTRE"; cor = "#b71c1c"; }
                else if(total >= 20) { cat = "EXTREMO"; cor = "#ffc107"; }
                else if(total <= 8) { cat = "FALHA"; cor = "#607d8b"; }

                document.getElementById('dice-text').innerHTML = `
                    <img src="${DADO_IMG_URL}" style="width:50px;"><br>
                    <span style="font-weight:900; color:#5c3a21; text-transform:uppercase;">${nome}</span><br>
                    <span class="pop-total" style="color:${cor}">${total}</span>
                    <div class="pop-categoria-badge" style="background:${cor}">${cat}</div><br>
                    <small style="font-weight:900; color:#555;">(d20: ${d20} + Bônus: ${bonus})</small>
                `;
                socket.emit('player_dice_roll', { uid: meuUID, char: document.getElementById('char-name-input').value, rolagem: nome, total: total, cat: cat });
                diceState = 2;
            }
        }, 40);

        overlay.onclick = () => { if(diceState === 2) { box.classList.remove('dice-pop-active'); overlay.style.display = 'none'; diceState = 0; } };
    }

    // === LÓGICA DE NEGÓCIO E CARGA ===
    function recalcularTudo() {
        const forca = getValor('forca');
        const cargaMax = 10 + (forca * 2);
        document.getElementById('carga-max').innerText = cargaMax;
        
        let cargaAtual = 0;
        dbInventario.forEach(i => { if(i.equipado) cargaAtual += i.peso || 0; });
        document.getElementById('carga-atual').innerText = cargaAtual;
        const fill = document.getElementById('carga-fill');
        fill.style.width = Math.min((cargaAtual/cargaMax)*100, 100) + '%';
        fill.style.background = cargaAtual > cargaMax ? "#b71c1c" : "#2e7d32";

        const nivel = parseInt(document.getElementById('nivel').value);
        const bonusProf = nivel < 5 ? 2 : nivel < 9 ? 3 : nivel < 13 ? 4 : 5;
        
        listaPericiasBase.forEach(p => {
            let d = dbPericias[p.n];
            d.total = getValor(p.a) + (d.treinado ? bonusProf : 0);
        });
        renderizarPericias();
    }

    function renderizarPericias() {
        const grid = document.getElementById('grid-pericias'); grid.innerHTML = '';
        listaPericiasBase.forEach(p => {
            const d = dbPericias[p.n];
            grid.innerHTML += `<div class="pericia-card ${d.treinado ? 'treinado' : ''}" onclick="rolarDado('${p.n}', ${d.total})">
                <div class="pericia-header">${p.n}</div>
                <div class="pericia-roll-box"><span>+${d.total}</span></div>
            </div>`;
        });
        renderizarListas();
    }

    function renderizarListas() {
        const gridInv = document.getElementById('grid-inventario'); gridInv.innerHTML = '';
        const listArmas = document.getElementById('lista-armas-equipadas'); listArmas.innerHTML = '';

        dbInventario.forEach(i => {
            gridInv.innerHTML += `<div class="pericia-card" onclick="abrirVisualizacao('inv', ${i.id})">
                <div style="font-size:1.4rem;">${i.tipo === 'dist' ? '🏹' : (i.tipo === 'corpo' ? '⚔️' : '🎒')}</div>
                <div class="pericia-header">${i.nome}</div>
                <div style="font-size:0.7rem; font-weight:900;">${i.peso} ESPAÇOS</div>
                <div class="equip-box" onclick="event.stopPropagation()"><input type="checkbox" ${i.equipado ? 'checked' : ''} onchange="toggleEquip(${i.id})"> EQUIPAR</div>
            </div>`;
            if(i.equipado && (i.tipo === 'corpo' || i.tipo === 'dist')) {
                listArmas.innerHTML += `<div class="item-btn" style="flex-direction:column; gap:5px;">
                    <div style="display:flex; justify-content:space-between;"><span>${i.nome}</span> <small>${i.dano}</small></div>
                    <div style="display:flex; gap:5px;"><button class="btn-salvar" style="padding:4px; font-size:0.7rem;" onclick="rolarDado('Atq: ${i.nome}', 0)">ATACAR</button></div>
                </div>`;
            }
        });

        document.getElementById('lista-habilidades').innerHTML = dbHabilidades.map(h => `<button class="item-btn" onclick="abrirVisualizacao('hab', ${h.id})">${h.nome}</button>`).join('');
        document.getElementById('lista-guildas').innerHTML = dbGuildas.map(g => `<button class="item-btn" onclick="abrirVisualizacao('guilda', ${g.id})">${g.nome}</button>`).join('');
        document.getElementById('lista-pessoas').innerHTML = dbPessoas.map(p => `<button class="item-btn" onclick="abrirVisualizacao('pessoa', ${p.id})">${p.nome}</button>`).join('');
        document.getElementById('lista-locais').innerHTML = dbLocais.map(l => `<button class="item-btn" onclick="abrirVisualizacao('local', ${l.id})">${l.nome}</button>`).join('');
        renderizarMagias();
    }

    // === MAGIAS POR CÍRCULO (FIXED) ===
    function renderizarMagias() {
        const container = document.getElementById('magias-container'); container.innerHTML = '';
        const circulos = ["1", "2", "3", "4"];
        circulos.forEach(c => {
            let filt = dbMagias.filter(m => m.circulo === c);
            if(filt.length > 0) {
                let html = `<div class="magia-circulo-section"><h3 class="magia-circulo-title">${c}º CÍRCULO</h3><div class="pericias-grid">`;
                filt.forEach(m => { html += `<div class="pericia-card" style="border-color:#b71c1c" onclick="abrirVisualizacao('magia', ${m.id})"><div class="pericia-header">${m.nome}</div></div>`; });
                container.innerHTML += html + `</div></div>`;
            }
        });
    }

    // Funções de CRUD e Visualização
    function toggleEquip(id) { let i = dbInventario.find(x => x.id === id); if(i) i.equipado = !i.equipado; recalcularTudo(); }

    function abrirVisualizacao(tipo, id) {
        tipoContexto = tipo;
        let l = tipo === 'inv' ? dbInventario : (tipo === 'magia' ? dbMagias : (tipo === 'hab' ? dbHabilidades : (tipo === 'guilda' ? dbGuildas : dbPessoas)));
        let item = l.find(x => x.id === id); if(!item) return;
        itemAbertoId = id;
        document.getElementById('mv-nome').innerText = item.nome;
        document.getElementById('mv-desc').innerText = (item.dano ? "DANO: " + item.dano + " | CRIT: " + item.crit + "\n\n" : "") + (item.desc || "Sem descrição.");
        document.getElementById('mv-actions-dist').style.display = item.tipo === 'dist' ? 'block' : 'none';
        document.getElementById('modal-view').style.display = 'flex';
    }

    function apagarItemAberto() {
        if(tipoContexto === 'inv') dbInventario = dbInventario.filter(x => x.id !== itemAbertoId);
        else if(tipoContexto === 'magia') dbMagias = dbMagias.filter(x => x.id !== itemAbertoId);
        else if(tipoContexto === 'hab') dbHabilidades = dbHabilidades.filter(x => x.id !== itemAbertoId);
        else if(tipoContexto === 'guilda') dbGuildas = dbGuildas.filter(x => x.id !== itemAbertoId);
        else dbPessoas = dbPessoas.filter(x => x.id !== itemAbertoId);
        renderizarListas(); fecharModais();
    }

    // Modal Adders
    function abrirModalInv() { fecharModais(); document.getElementById('modal-inventario').style.display = 'flex'; }
    function mudarAbaItem(t) { 
        tipoContexto = t; document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active');
        document.getElementById('arma-campos').style.display = (t==='corpo'||t==='dist') ? 'block' : 'none';
        document.getElementById('mun-campos').style.display = t==='dist' ? 'block' : 'none';
    }
    function salvarItemInv() { 
        let n = document.getElementById('mi-nome').value; if(!n) return;
        dbInventario.push({ id: Date.now(), nome: n, peso: parseFloat(document.getElementById('mi-peso').value), tipo: tipoContexto, dano: document.getElementById('mi-dano').value, crit: document.getElementById('mi-crit').value, desc: document.getElementById('mi-desc').value, equipado: false, munAtual: 20, munMax: 20 });
        renderizarListas(); fecharModais();
    }
    function dispararArma() { let a = dbInventario.find(x => x.id === itemAbertoId); if(a.munAtual > 0) { a.munAtual--; alert("Disparou! Restam: " + a.munAtual); } else alert("Sem munição!"); }
    function recarregarArma() { let a = dbInventario.find(x => x.id === itemAbertoId); a.munAtual = a.munMax; alert("Munição Recarregada!"); }

    function abrirModalMagia() { document.getElementById('modal-magia-add').style.display = 'flex'; }
    function salvarMagia() {
        let n = document.getElementById('mm-nome').value; if(!n) return;
        dbMagias.push({ id: Date.now(), nome: n, circulo: document.getElementById('mm-circulo').value, desc: document.getElementById('mm-desc').value });
        renderizarMagias(); fecharModais();
    }

    function abrirModalLista(t) { tipoContexto = t; document.getElementById('ml-titulo').innerText = "Adicionar " + t; document.getElementById('modal-listas').style.display = 'flex'; }
    function salvarListaExtra() {
        let n = document.getElementById('ml-nome').value; if(!n) return;
        let d = { id: Date.now(), nome: n, desc: document.getElementById('ml-desc').value };
        if(tipoContexto==='guilda') dbGuildas.push(d); else if(tipoContexto==='pessoa') dbPessoas.push(d); else dbLocais.push(d);
        renderizarListas(); fecharModais();
    }

    function abrirModalHab() { document.getElementById('modal-hab').style.display = 'flex'; }
    function salvarHab() { let n = document.getElementById('mh-nome').value; if(n) dbHabilidades.push({id:Date.now(), nome:n, desc:document.getElementById('mh-desc').value}); renderizarListas(); fecharModais(); }

    // Auxiliares
    function getValor(id) { return parseFloat(document.getElementById(id).value) || 0; }
    function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
    function mudarAbaPrincipal(id, btn) { document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); btn.classList.add('active'); }
    function alterarStatus(id, d) { let el = document.getElementById(id); el.value = (parseInt(el.value)||0) + d; atualizarBarras(); }
    function atualizarBarras() {
        let vA = getValor('vida-atual'), vM = getValor('vida-max'), mA = getValor('mana-atual'), mM = getValor('mana-max');
        document.getElementById('vida-fill').style.width = Math.min((vA/(vM||1))*100, 100) + '%';
        document.getElementById('mana-fill').style.width = Math.min((mA/(mM||1))*100, 100) + '%';
        sincronizarComMestre();
    }

    function loadHeaderPortrait(input) {
        const file = input.files[0]; if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { const i = document.getElementById('portrait-img'); i.src = e.target.result; i.style.display = 'block'; document.getElementById('portrait-placeholder').style.display = 'none'; sincronizarComMestre(); };
            reader.readAsDataURL(file);
        }
    }

    window.onload = () => { recalcularTudo(); atualizarBarras(); };
</script>

</body>
</html>
