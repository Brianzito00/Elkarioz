<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escudo do Mestre - RPG Total</title>
    <style>
        /* === FONTES E RESET === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto:wght@500;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Lora', serif; background-color: #170f0a; 
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicij-pbyNJBmSq1lNLeur-8lJkGfzOOurAvNt5ruR5j2KHWV9Qvqa90urImliVnN1Nvwm5ho0jTfeeNNjeUuSG-VDox7XojiJXx-6-2k4TJ5Or2PkHgGFgFwI4-ineXJaBO8nnt6Q9uchp7TobVp8W-HUKqTWhSU3Sg-uJFxZdvlYDy0kep7xEh0SrU5xt/w1519-h855/Gemini_Generated_Image_k9b6nuk9b6nuk9b6.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #3e2723; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh;
        }

        .gm-header {
            background-color: rgba(92, 58, 33, 0.95); width: 100%; max-width: 1400px; padding: 20px; border-radius: 8px;
            border: 2px solid #ff9100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .gm-title { font-family: 'Cinzel', serif; color: #f4ebd8; font-size: 2rem; margin: 0; font-weight: 900; text-shadow: 2px 2px 5px #000; }
        .room-config { display: flex; gap: 10px; align-items: center; }
        .room-config input { padding: 10px; border: 2px solid #000; font-family: 'Cinzel'; font-weight: bold; font-size: 1.1rem; border-radius: 4px; text-align: center; width: 150px; }
        .btn-mestre { background: #b71c1c; color: #fff; border: 2px solid #ff9100; padding: 10px 20px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .btn-mestre:hover { background: #ff9100; color: #3e2723; }

        /* === LAYOUT PRINCIPAL === */
        .gm-layout { display: flex; gap: 20px; width: 100%; max-width: 1400px; align-items: flex-start; flex-wrap: wrap; }
        
        .panel { 
            background-color: rgba(244, 235, 216, 0.9); backdrop-filter: blur(8px);
            padding: 25px; border-radius: 8px; border: 3px solid #8b5a2b; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .panel-title { font-family: 'Cinzel'; color: #b71c1c; font-size: 1.4rem; font-weight: 900; border-bottom: 2px solid rgba(139, 90, 43, 0.5); padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; }

        /* === COLUNA ESQUERDA: MONITORAMENTO === */
        .col-monitor { flex: 1; min-width: 350px; display: flex; flex-direction: column; gap: 20px; }
        
        .players-grid { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .player-card { background: rgba(255,255,255,0.7); border: 2px solid #5c3a21; border-radius: 6px; padding: 15px; display: flex; gap: 15px; align-items: center; }
        .player-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #b71c1c; }
        .player-info { flex: 1; }
        .player-name { font-family: 'Cinzel'; font-weight: 900; font-size: 1.1rem; color: #3e2723; line-height: 1; margin-bottom: 5px; }
        .player-realname { font-family: 'Roboto'; font-size: 0.8rem; color: #555; margin-bottom: 10px; display: block; }
        .player-stats { display: flex; gap: 10px; font-family: 'Roboto'; font-weight: bold; font-size: 0.85rem; }
        .stat-badge { padding: 4px 8px; border-radius: 4px; color: #fff; text-shadow: 1px 1px 0 #000; }
        .badge-hp { background: #b71c1c; } .badge-mp { background: #0d47a1; } .badge-def { background: #455a64; }

        .dice-log { background: #170f0a; border: 2px solid #5c3a21; border-radius: 6px; padding: 15px; height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .log-entry { background: rgba(244, 235, 216, 0.1); border-left: 4px solid #fff; padding: 10px; border-radius: 4px; color: #f4ebd8; font-family: 'Roboto'; }
        .log-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.8rem; color: #aaa; }
        .log-title { font-family: 'Cinzel'; font-weight: bold; color: #ff9100; font-size: 1.1rem; text-transform: uppercase; }
        .log-result { font-size: 1.5rem; font-weight: 900; margin-top: 5px; font-family: 'Cinzel'; }

        /* === COLUNA DIREITA: ENVIO DE ENTIDADES === */
        .col-editor { flex: 2; min-width: 400px; display: flex; flex-direction: column; gap: 20px; }

        .tabs-nav { display: flex; border-bottom: 2px solid #8b5a2b; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: rgba(234, 221, 197, 0.5); border: none; padding: 15px; font-family: 'Cinzel'; font-weight: bold; color: #5c3a21; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .tab-btn.active { background: #8b5a2b; color: #fff; }
        .tab-content { display: none; } .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-label { font-family: 'Roboto'; font-weight: 900; font-size: 0.8rem; color: #5c3a21; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .form-input { width: 100%; padding: 12px; border: 2px solid #5c3a21; background: #fff; font-family: 'Lora'; font-weight: bold; font-size: 1rem; border-radius: 4px; }
        
        .subitem-box { background: rgba(0,0,0,0.05); border: 1px dashed #8b5a2b; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .subitem-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .subitem-badge { background: #3e2723; color: #f4ebd8; padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; font-family: 'Roboto'; display: flex; align-items: center; gap: 8px; }
        .subitem-badge span { color: #ff9100; cursor: pointer; font-weight: bold; }

        .target-box { background: rgba(183, 28, 28, 0.1); border: 2px solid #b71c1c; padding: 15px; border-radius: 6px; margin-top: 20px; margin-bottom: 20px; }
        .target-box input { border-color: #b71c1c; color: #b71c1c; }

        .btn-enviar { width: 100%; background: #2e7d32; color: #fff; border: none; padding: 15px; font-family: 'Cinzel'; font-weight: 900; font-size: 1.2rem; border-radius: 4px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-enviar:hover { background: #1b5e20; }
        
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); } ::-webkit-scrollbar-thumb { background: #8b5a2b; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="gm-header">
        <h1 class="gm-title">ESCUDO DO MESTRE</h1>
        <div class="room-config">
            <label style="color:#f4ebd8; font-family:'Roboto'; font-weight:bold; font-size:0.8rem;">UID DA SALA:</label>
            <input type="text" id="gm-uid" placeholder="Ex: SESSAO123">
            <button class="btn-mestre" onclick="conectarSala()">CONECTAR MESA</button>
        </div>
    </div>

    <div class="gm-layout">
        
        <div class="col-monitor">
            <div class="panel">
                <h2 class="panel-title">Jogadores na Mesa</h2>
                <div class="players-grid" id="players-container">
                    <div style="color:#8b5a2b; font-style:italic; font-size:0.9rem; text-align:center;">Aguardando conexões...</div>
                </div>
            </div>

            <div class="panel" style="padding: 15px;">
                <h2 class="panel-title" style="margin-left:10px;">Log de Rolagens</h2>
                <div class="dice-log" id="dice-log-container"></div>
            </div>
        </div>

        <div class="panel col-editor">
            <h2 class="panel-title">Adicionar ao Mundo</h2>
            
            <div class="tabs-nav">
                <button class="tab-btn active" onclick="mudarAba('npc')">NPC / PESSOA</button>
                <button class="tab-btn" onclick="mudarAba('guilda')">GUILDA / FACÇÃO</button>
                <button class="tab-btn" onclick="mudarAba('local')">LOCAL</button>
            </div>

            <div class="form-group">
                <label class="form-label">Nome da Entidade</label>
                <input type="text" id="form-nome" class="form-input" placeholder="Ex: Rei Arthur, Guilda dos Ladrões, Taverna...">
            </div>

            <div class="form-group" id="box-imagem">
                <label class="form-label">URL da Imagem (Opcional)</label>
                <input type="text" id="form-img" class="form-input" placeholder="http://link-da-imagem.com/foto.jpg">
            </div>

            <div class="subitem-box" id="box-subitens" style="display: none;">
                <label class="form-label" id="label-subitens">Adicionar Membros / Pontos</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="form-subitem-nome" class="form-input" placeholder="Nome do Membro / Local..." style="margin-bottom:0;">
                    <button class="btn-mestre" style="padding: 0 20px; font-size: 1.5rem; margin-top:0;" onclick="addSubItem()">+</button>
                </div>
                <div class="subitem-list" id="lista-subitens-temp"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Descrição / Histórico</label>
                <textarea id="form-desc" class="form-input" style="height: 120px; resize: vertical;" placeholder="Detalhes que os jogadores poderão ler..."></textarea>
            </div>

            <div class="target-box">
                <label class="form-label" style="color:#b71c1c;">ALVO DO ENVIO (Quem vai receber na ficha?)</label>
                <input type="text" id="form-target" class="form-input" value="todos" placeholder="Digite 'todos' ou o Nome do Personagem">
                <small style="color:#5c3a21; font-family:'Roboto'; font-weight:bold; display:block; margin-top:5px;">Para enviar a todos, deixe "todos". Para enviar a um jogador específico, digite o Nome do Personagem exato dele.</small>
            </div>

            <button class="btn-enviar" onclick="enviarEntidade()">🚀 ENVIAR PARA JOGADOR(ES)</button>

        </div>
    </div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let gmUid = "";
    let jogadores = {}; // Armazena dados dos jogadores
    let tempSubItems = []; // Array temporário para membros de guilda ou pontos de local
    let abaAtual = 'npc';

    // === CONEXÃO DO MESTRE ===
    function conectarSala() {
        gmUid = document.getElementById('gm-uid').value.trim();
        if(!gmUid) return alert("Digite um UID de sala para monitorar!");
        alert("Escudo Conectado à sala: " + gmUid);
        // O mestre pode emitir para o backend que entrou na sala
        // Dependendo de como o servidor está estruturado, ele passa a ouvir eventos
    }

    // === RECEBIMENTO DE DADOS DOS JOGADORES (atualizarDados) ===
    socket.on('atualizarDados', function(data) {
        // Se a sala não bater (caso o servidor mande tudo global, filtramos aqui)
        if(gmUid && data.uid !== gmUid) return;

        let j = data.dados;
        if(!j.charName) return;

        // Atualiza ou insere jogador
        jogadores[j.charName] = j;
        renderizarJogadores();
    });

    function renderizarJogadores() {
        const container = document.getElementById('players-container');
        container.innerHTML = '';
        
        let chaves = Object.keys(jogadores);
        if(chaves.length === 0) {
            container.innerHTML = '<div style="color:#8b5a2b; font-style:italic; font-size:0.9rem; text-align:center;">Nenhum jogador enviou dados ainda.</div>';
            return;
        }

        chaves.forEach(key => {
            let p = jogadores[key];
            let imgHtml = p.img ? `<img src="${p.img}" class="player-img">` : `<div class="player-img" style="background:#3e2723; display:flex; align-items:center; justify-content:center; font-size:2rem;">👤</div>`;
            
            container.innerHTML += `
                <div class="player-card">
                    ${imgHtml}
                    <div class="player-info">
                        <div class="player-name">${p.charName || 'Desconhecido'} (Nvl ${p.nivel || 1})</div>
                        <div class="player-realname">Jogador: ${p.playerName || '-'}</div>
                        <div class="player-stats">
                            <span class="stat-badge badge-hp">PV: ${p.hpAtual}/${p.hpMax}</span>
                            <span class="stat-badge badge-mp">PM: ${p.mpAtual}/${p.mpMax}</span>
                            <span class="stat-badge badge-def">DEF: ${p.defesa}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // === RECEBIMENTO DE DADOS DE ROLAGEM (player_dice_roll) ===
    socket.on('player_dice_roll', function(roll) {
        if(gmUid && roll.uid !== gmUid) return;

        const logContainer = document.getElementById('dice-log-container');
        
        let color = roll.corCategoria || "#33cc00";
        let shadow = roll.isCritico || roll.isDesastre ? `box-shadow: 0 0 10px ${color};` : '';
        let resultStyle = `color: ${color}; text-shadow: 1px 1px 0 #000;`;

        let entry = `
            <div class="log-entry" style="border-left-color: ${color}; ${shadow}">
                <div class="log-header">
                    <span><strong>${roll.playerName || 'Jogador'}</strong> rolou:</span>
                    <span style="color:${color}; font-weight:bold;">${roll.categoria}</span>
                </div>
                <div class="log-title">${roll.nomeRolagem}</div>
                <div class="log-result" style="${resultStyle}">${roll.resultadoFinal}</div>
                <div style="font-size:0.75rem; color:#aaa; margin-top:3px;">${roll.detalhes}</div>
            </div>
        `;

        // Prepend (coloca no topo)
        logContainer.innerHTML = entry + logContainer.innerHTML;
        
        // Limita a 50 rolagens no log para não travar
        if(logContainer.children.length > 50) {
            logContainer.removeChild(logContainer.lastChild);
        }
    });

    // === GERENCIAMENTO DE FORMULÁRIO (ENTIDADES) ===
    function mudarAba(tipo) {
        abaAtual = tipo;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Limpa formulário
        document.getElementById('form-nome').value = '';
        document.getElementById('form-img').value = '';
        document.getElementById('form-desc').value = '';
        tempSubItems = []; renderSubItems();

        if (tipo === 'npc') {
            document.getElementById('box-imagem').style.display = 'block';
            document.getElementById('box-subitens').style.display = 'none';
        } else {
            document.getElementById('box-imagem').style.display = 'none';
            document.getElementById('box-subitens').style.display = 'block';
            document.getElementById('label-subitens').innerText = tipo === 'guilda' ? 'ADICIONAR MEMBROS DA GUILDA' : 'ADICIONAR PONTOS DO LOCAL / NPCs';
        }
    }

    function addSubItem() {
        let input = document.getElementById('form-subitem-nome');
        let nome = input.value.trim();
        if(nome) {
            // O ID é gerado pelo mestre antes de enviar, para a ficha do jogador conseguir ler
            tempSubItems.push({ id: Date.now() + Math.floor(Math.random()*1000), nome: nome, desc: '', img: '' });
            input.value = '';
            renderSubItems();
        }
    }

    function removeSubItem(idx) {
        tempSubItems.splice(idx, 1);
        renderSubItems();
    }

    function renderSubItems() {
        const list = document.getElementById('lista-subitens-temp');
        list.innerHTML = '';
        tempSubItems.forEach((sub, idx) => {
            list.innerHTML += `<div class="subitem-badge">${sub.nome} <span onclick="removeSubItem(${idx})">&times;</span></div>`;
        });
    }

    // === ENVIO PARA OS JOGADORES (gm_send_entity) ===
    function enviarEntidade() {
        let nome = document.getElementById('form-nome').value.trim();
        if(!nome) return alert("A entidade precisa ter um nome!");

        let desc = document.getElementById('form-desc').value.trim();
        let img = document.getElementById('form-img').value.trim();
        let target = document.getElementById('form-target').value.trim() || 'todos';

        // Constrói o objeto de dados esperado pela ficha do jogador
        let dados = { id: Date.now(), nome: nome, desc: desc };

        if(abaAtual === 'npc' || abaAtual === 'pessoa') {
            abaAtual = 'pessoa'; // Força o padrão da ficha
            dados.img = img;
        } else if (abaAtual === 'guilda') {
            dados.membros = [...tempSubItems];
        } else if (abaAtual === 'local') {
            dados.pontos = [...tempSubItems];
        }

        // Payload padrão estruturado para bater com a ficha
        let payload = {
            target: target,
            entidade: {
                tipoLista: abaAtual,
                dados: dados
            }
        };

        // Envia para o servidor (que fará o broadcast)
        socket.emit('gm_send_entity', payload);

        alert(`Enviado com sucesso para: ${target.toUpperCase()}!`);
        
        // Limpar form após envio
        document.getElementById('form-nome').value = '';
        document.getElementById('form-desc').value = '';
        tempSubItems = []; renderSubItems();
    }

</script>

</body>
</html>
