<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor da Mesa - RPG</title>
    <style>
        /* === FONTES E RESET === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto:wght@500;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Lora', serif; 
            background-color: #170f0a; 
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicij-pbyNJBmSq1lNLeur-8lJkGfzOOurAvNt5ruR5j2KHWV9Qvqa90urImliVnN1Nvwm5ho0jTfeeNNjeUuSG-VDox7XojiJXx-6-2k4TJ5Or2PkHgGFgFwI4-ineXJaBO8nnt6Q9uchp7TobVp8W-HUKqTWhSU3Sg-uJFxZdvlYDy0kep7xEh0SrU5xt/w1519-h855/Gemini_Generated_Image_k9b6nuk9b6nuk9b6.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #3e2723; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; margin: 0; min-height: 100vh;
        }

        /* === PAINEL PRINCIPAL (Estilo Pergaminho) === */
        .painel-mestre {
            background-color: #e3d8c1;
            background-image: radial-gradient(circle at center, rgba(139,90,43,0.08) 0%, rgba(227, 216, 193, 1) 60%);
            border: 4px solid #4a2f1d;
            border-radius: 8px;
            width: 100%; max-width: 800px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 50px rgba(139,90,43,0.2);
            display: flex; flex-direction: column; padding: 30px;
            position: relative;
        }

        .header-titulo {
            text-align: center; font-family: 'Cinzel', serif; font-weight: 900; font-size: 2.2rem; color: #4a2f1d;
            margin-top: 0; margin-bottom: 25px; letter-spacing: 1px; border-bottom: 2px solid rgba(74, 47, 29, 0.3); padding-bottom: 15px;
        }

        /* === CAIXA DE CONEXÃO === */
        .box-conexao {
            background-color: #f1e8d5; border: 2px solid #a68b6c; border-radius: 6px; padding: 20px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center;
        }

        .form-input {
            padding: 12px; border: 2px solid #a68b6c; border-radius: 4px; background-color: #faf5eb; 
            font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: bold; color: #b71c1c; text-align: center; width: 250px;
        }
        .form-input:focus { border-color: #8b5a2b; outline: none; background-color: #fff; }

        .btn-acao {
            background-color: #4a2f1d; color: #f1e8d5; border: 2px solid #2d1c11; border-radius: 4px;
            padding: 12px 25px; font-family: 'Cinzel', serif; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .btn-acao:hover { background-color: #634028; }

        /* === LISTA DE JOGADORES === */
        .section-title {
            font-family: 'Cinzel', serif; font-weight: 800; font-size: 1.3rem; color: #4a2f1d;
            text-align: center; margin-bottom: 20px;
        }

        #players-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;
        }

        .player-card { 
            background: rgba(255,255,255,0.7); border: 2px solid #a68b6c; border-radius: 6px; 
            padding: 15px; display: flex; gap: 15px; align-items: center; transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .player-card:hover { border-color: #8b5a2b; background: #fff; transform: translateY(-2px); }
        
        .player-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #4a2f1d; flex-shrink: 0; }
        .player-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .player-name { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.2rem; color: #4a2f1d; line-height: 1.1; margin-bottom: 4px; }
        .player-realname { font-family: 'Roboto', sans-serif; font-size: 0.8rem; color: #8b5a2b; margin-bottom: 8px; font-weight: bold;}
        
        .player-stats { display: flex; gap: 8px; font-family: 'Roboto', sans-serif; font-size: 0.85rem; font-weight: bold; }
        .stat-badge { padding: 4px 8px; border-radius: 4px; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="painel-mestre">
    <h1 class="header-titulo">MONITOR DA MESA</h1>

    <div class="box-conexao">
        <p style="font-family: 'Roboto'; font-size: 0.95rem; color: #666; font-weight: bold; margin-top: 0; text-transform: uppercase;">Insira a UID da Sala para monitorar os jogadores</p>
        <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
            <input type="text" id="gm-uid" class="form-input" placeholder="Ex: UID123">
            <button class="btn-acao" onclick="conectarSala()">CONECTAR</button>
        </div>
    </div>

    <h2 class="section-title">JOGADORES CONECTADOS</h2>
    <div id="players-container">
        <div style="grid-column: 1 / -1; text-align:center; font-style:italic; color:#8b5a2b; font-size:1rem; padding: 20px;">
            Aguardando conexão com a sala...
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let gmUid = "";
    let jogadores = {}; 

    // === CONEXÃO DO MESTRE ===
    function conectarSala() {
        gmUid = document.getElementById('gm-uid').value.trim();
        if(!gmUid) return alert("Por favor, digite um UID de sala para monitorar!");
        
        alert("Monitor conectado à sala: " + gmUid);
        
        // Altera o texto de espera caso ainda não tenha jogadores
        if(Object.keys(jogadores).length === 0) {
            document.getElementById('players-container').innerHTML = '<div style="grid-column: 1 / -1; text-align:center; font-style:italic; color:#8b5a2b; font-size:1rem; padding: 20px;">Sala conectada. Aguardando dados dos jogadores...</div>';
        } else {
            renderizarJogadores();
        }
    }

    // === RECEBIMENTO DE DADOS DA FICHA DOS JOGADORES ===
    socket.on('atualizarDados', function(data) {
        // Ignora se não estiver na mesma sala
        if(gmUid && data.uid !== gmUid) return;

        let j = data.dados;
        if(!j.charName) return;
        
        jogadores[j.charName] = j;
        
        // Só renderiza se o mestre já tiver digitado a UID da sala
        if (gmUid) {
            renderizarJogadores();
        }
    });

    // === RENDERIZAR CARDS DOS JOGADORES ===
    function renderizarJogadores() {
        const container = document.getElementById('players-container');
        let chaves = Object.keys(jogadores);
        
        if(chaves.length === 0) return; // Mantém a mensagem de espera

        container.innerHTML = ''; // Limpa o container para adicionar os cards
        
        chaves.forEach(key => {
            let p = jogadores[key];
            let imgHtml = p.img ? `<img src="${p.img}" class="player-img">` : `<div class="player-img" style="background:#e3d8c1; display:flex; align-items:center; justify-content:center; font-size:1.8rem;">👤</div>`;
            
            container.innerHTML += `
                <div class="player-card">
                    ${imgHtml}
                    <div class="player-info">
                        <div class="player-name">${p.charName} <span style="font-size:0.8rem; color:#666; font-family: 'Roboto';">(Nvl ${p.nivel || 1})</span></div>
                        <div class="player-realname">Jogador(a): ${p.playerName || '-'}</div>
                        <div class="player-stats">
                            <span class="stat-badge" style="background:#b71c1c;">PV: ${p.hpAtual}/${p.hpMax}</span>
                            <span class="stat-badge" style="background:#0d47a1;">PM: ${p.mpAtual}/${p.mpMax}</span>
                            <span class="stat-badge" style="background:#455a64;">DEF: ${p.defesa}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
