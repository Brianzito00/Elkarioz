<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor da Mesa - RPG Total</title>
    <style>
        /* === FONTES E RESET GERAL === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto:wght@500;700;900&display=swap');
        * { box-sizing: border-box; }
        body { font-family: 'Lora', serif; background-color: #170f0a; background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicij-pbyNJBmSq1lNLeur-8lJkGfzOOurAvNt5ruR5j2KHWV9Qvqa90urImliVnN1Nvwm5ho0jTfeeNNjeUuSG-VDox7XojiJXx-6-2k4TJ5Or2PkHgGFgFwI4-ineXJaBO8nnt6Q9uchp7TobVp8W-HUKqTWhSU3Sg-uJFxZdvlYDy0kep7xEh0SrU5xt/w1519-h855/Gemini_Generated_Image_k9b6nuk9b6nuk9b6.png'); background-size: cover; background-position: center; background-attachment: fixed; color: #3e2723; display: flex; justify-content: center; align-items: flex-start; padding: 30px 20px; margin: 0; min-height: 100vh; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { appearance: textfield; -moz-appearance: textfield; }

        .painel-mestre { background: linear-gradient(135deg, rgba(244, 235, 216, 0.95), rgba(220, 205, 180, 0.9)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 30px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(139, 90, 43, 0.2); width: 100%; max-width: 1750px; border: 2px solid #5c3a21; outline: 6px solid rgba(92, 58, 33, 0.7); outline-offset: -10px; display: flex; flex-direction: column; position: relative; }
        .header-titulo { text-align: center; font-family: 'Cinzel', serif; font-weight: 900; font-size: 2.5rem; color: #3e2723; text-shadow: 2px 2px 0px rgba(255,255,255,0.5); margin-top: 0; margin-bottom: 20px; letter-spacing: 2px; border-bottom: 3px double rgba(139, 90, 43, 0.6); padding-bottom: 15px; text-transform: uppercase; }
        .btn-header-sessao { position: absolute; top: 25px; right: 30px; width: auto; padding: 10px 20px; font-size: 0.9rem; background: linear-gradient(to bottom, #1565c0, #0d47a1); z-index: 10; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        
        .tabs-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; border-bottom: 4px solid #5c3a21; flex-wrap: wrap; }
        .tab-btn { background: linear-gradient(to bottom, #f4ebd8, #eaddc4); border: 2px solid #5c3a21; border-bottom: none; padding: 12px 30px; cursor: pointer; font-family: 'Cinzel', serif; font-weight: 900; color: #5c3a21; border-radius: 12px 12px 0 0; transition: all 0.3s; font-size: 1.05rem; transform: translateY(2px);}
        .tab-btn:hover { background: #fff; transform: translateY(0); }
        .tab-btn.active { background: linear-gradient(to bottom, #d32f2f, #b71c1c); color: #fff; border-color: #b71c1c; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); box-shadow: 0 -4px 15px rgba(183, 28, 28, 0.4); z-index: 2; transform: translateY(1px);}
        .tab-content { display: none; animation: fadeIn 0.4s ease; height: 100%;} 
        .tab-content.active { display: flex; flex-direction: column;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .conteudo-wrapper { display: flex; gap: 25px; align-items: stretch; width: 100%; height: calc(100vh - 220px); min-height: 600px; }
        .coluna-central { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .section-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.3rem; color: #3e2723; text-align: center; border-bottom: 2px dashed rgba(139, 90, 43, 0.4); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        .box-rpg { background: rgba(255, 255, 255, 0.6); border: 1px solid #c8b99e; border-top: 4px solid #8b5a2b; border-radius: 8px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; }
        .form-input { padding: 12px; border: 2px solid #8b5a2b; border-radius: 6px; background-color: #fff; font-family: 'Lora', serif; font-weight: bold; font-size: 1rem; color: #3e2723; text-align: center; width: 100%; transition: 0.2s;}
        
        .btn-acao { background: linear-gradient(to bottom, #795548, #5c3a21); color: #fff; border: 2px solid #3e2723; border-radius: 6px; padding: 12px 20px; font-family: 'Cinzel', serif; font-weight: 900; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px #000; letter-spacing: 1px;}
        .btn-acao:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-acao.red { background: linear-gradient(to bottom, #d32f2f, #b71c1c); border-color: #7f0000; }
        .btn-acao.green { background: linear-gradient(to bottom, #43a047, #2e7d32); border-color: #1b5e20; }
        .btn-acao.blue { background: linear-gradient(to bottom, #1e88e5, #0d47a1); border-color: #002171; }
        
        .mesa-layout { display: flex; gap: 20px; height: 100%; align-items: stretch; }
        .mesa-sidebar { flex: 0 0 350px; display: flex; flex-direction: column; height: 100%; }
        .mesa-jogadores { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* AQUI AUMENTAMOS O TAMANHO DOS CARDS NA MESA */
        #players-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; flex: 1; overflow-y: auto; padding-right: 5px; align-content: start; }
        #lista-bestiario-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 18px; overflow-y: auto; flex: 1; padding-right: 5px; align-content: start;}

        .player-card, .monstro-card { background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(244, 235, 216, 0.9)); border: 2px solid #c8b99e; border-bottom: 4px solid #8b5a2b; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s ease; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .monstro-fixado { border-color: #b71c1c; border-bottom: 4px solid #b71c1c; background: linear-gradient(145deg, rgba(255,255,255,1), rgba(183, 28, 28, 0.05)); }
        
        .btn-kick { position: absolute; top: 8px; right: 10px; border-radius: 50%; width: 24px; height: 24px; color: #b71c1c; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; border: none; background: rgba(0,0,0,0.05);}
        .player-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; border: 2px solid #5c3a21; flex-shrink: 0; background:#eaddc4; display:flex; align-items:center; justify-content:center; font-size:1.8rem; box-shadow: 0 4px 8px rgba(0,0,0,0.2);}
        .stat-badge { padding: 5px 10px; border-radius: 6px; color: #fff; font-family: 'Cinzel', serif; font-weight: 900; border: 2px solid #2d1c11; text-shadow: 1px 1px 1px #000; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 4px; font-size: 1.1rem;}
        
        .barras-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .bar-bg { width: 100%; height: 24px; background: rgba(0,0,0,0.2); border: 2px solid #3e2723; border-radius: 12px; position: relative; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .bar-fill { height: 100%; transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .fill-hp { background-color: #d32f2f; }
        .fill-mp { background-color: #1e88e5; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Roboto'; font-size: 0.85rem; font-weight: 900; color: #fff; text-shadow: 1px 1px 2px #000; letter-spacing: 1px;}
        
        .btn-hp-monstro { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px; width: 28px; height: 28px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: 0.2s; font-weight: bold;}
        .monstro-edit-hp { background: transparent; border: none; border-bottom: 2px solid rgba(255,255,255,0.8); color: #fff; font-family: 'Roboto', sans-serif; font-weight: 900; width: 45px; text-align: center; outline: none; font-size: 1rem;}
        
        .monstro-stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
        .monstro-stat-box { background: linear-gradient(to bottom, #fff, #f4ebd8); border: 2px solid #8b5a2b; border-bottom: 4px solid #8b5a2b; border-radius: 8px; padding: 6px 2px; cursor: pointer; transition: 0.2s; }
        .monstro-stat-label { font-family: 'Cinzel'; font-size: 0.7rem; font-weight: 900; color: #5c3a21; display: block; border-bottom: 1px solid rgba(139, 90, 43, 0.2); margin-bottom: 4px;}
        .monstro-stat-val { font-family: 'Roboto'; font-size: 1.1rem; font-weight: 900; color: #b71c1c; }
        
        .monstro-skill-btn { background: rgba(255,255,255,0.8); border: 1px solid #c8b99e; border-bottom: 3px solid #8b5a2b; border-radius: 8px; padding: 8px; font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 900; color: #3e2723; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; }
        .monstro-secao { border-top: 1px dashed rgba(139, 90, 43, 0.5); padding-top: 12px; margin-top: 10px; }
        .monstro-secao-titulo { font-family: 'Cinzel'; font-size: 0.9rem; font-weight: 900; color: #5c3a21; margin-bottom: 10px; display: block; text-transform: uppercase; }
        
        .btn-atq-monstro { color: #fff; border: 2px solid rgba(0,0,0,0.5); border-radius: 6px; padding: 8px 15px; font-weight: 900; font-size: 0.8rem; font-family: 'Roboto'; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; text-shadow: 1px 1px 1px #000; box-shadow: 0 3px 6px rgba(0,0,0,0.2); flex: 1;}
        .btn-atq-monstro.red { background: linear-gradient(to bottom, #d32f2f, #b71c1c); }
        .btn-atq-monstro.brown { background: linear-gradient(to bottom, #795548, #5c3a21); }
        .monstro-hab-item { font-family: 'Lora'; font-size: 0.9rem; color: #3e2723; background: rgba(255,255,255,0.8); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #8b5a2b; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}

        /* === POP-UP DADOS === */
        #dice-overlay-click { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 3999; display: none; background: rgba(0,0,0,0.6); }
        #dice-result-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.6); opacity: 0; background: linear-gradient(135deg, #fff, #f4ebd8); border: 6px solid #b71c1c; padding: 40px; border-radius: 20px; z-index: 4000; text-align: center; pointer-events: none; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 30px 80px rgba(0,0,0,0.9); min-width: 350px; max-width: 90%; display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 250px;}
        #dice-result-container.dice-pop-active { display: flex !important; opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        .pop-detalhes { color: #2d1c11; font-weight: 600; font-size: 1.05rem; font-family: 'Lora'; display: block; word-wrap: break-word; word-break: break-word; background: rgba(255,255,255,0.6); padding: 15px; border-radius: 8px; border: 1px dashed rgba(139, 90, 43, 0.4);}

        /* TOASTS */
        #toast-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column-reverse; gap: 15px; pointer-events: none; width: 360px; max-width: 90vw; }
        .toast-entry { background: rgba(255, 255, 255, 0.98); border: 2px solid; border-left-width: 10px !important; border-radius: 10px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); pointer-events: auto; backdrop-filter: blur(5px); animation: toastSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; cursor: pointer; transition: all 0.2s ease; word-wrap: break-word; word-break: break-word; }
        @keyframes toastSlideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* MODAIS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 5000; backdrop-filter: blur(8px); overflow-y: auto; padding: 20px;}
        .modal-content { background: linear-gradient(to bottom, #fdfbf7, #eaddc4); border: 4px solid #8b5a2b; padding: 35px; width: 95%; max-width: 750px; border-radius: 12px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.9); margin: auto;}
        .fechar-modal { position: absolute; top: 15px; right: 20px; font-size: 2.5rem; cursor: pointer; color: #8b5a2b; font-weight: bold; }
        
        .ini-row { background: linear-gradient(145deg, #fff, #f4ebd8); border: 2px solid #c8b99e; border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; transition: all 0.3s ease; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .ini-row.ativo { border-color: #b71c1c; background: linear-gradient(145deg, #fff, rgba(183, 28, 28, 0.08)); transform: scale(1.03) translateX(12px); border-width: 3px; }
        .ini-val { font-family: 'Roboto'; font-weight: 900; font-size: 2rem; color: #fff; background: linear-gradient(to bottom, #795548, #5c3a21); padding: 5px 20px; border-radius: 8px; border: 2px solid #2d1c11; }
        
        .toggle-fixar { display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Roboto'; font-size: 0.75rem; font-weight: 900; color: #5c3a21; text-transform: uppercase; background: rgba(255,255,255,0.6); padding: 6px 12px; border-radius: 6px; border: 1px solid #c8b99e; transition: 0.2s;}
        .toggle-fixar.ativo { background: #b71c1c; color: #fff; border-color: #7f0000; }
        .toggle-fixar input { display: none; }
    </style>
</head>
<body>

<div id="dice-overlay-click"></div>
<div id="dice-result-container"><div id="dice-text" style="width: 100%;"></div></div>
<div id="toast-container"></div>

<div class="painel-mestre">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
        <button class="btn-acao blue" style="width: auto; padding: 10px 20px;" onclick="document.getElementById('modal-sessao').style.display='flex'">🖥️ CONFIGURAR SESSÃO</button>
    </div>
    
    <h1 class="header-titulo">PAINEL DO MESTRE</h1>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="mudarAba('mesa')">🛡️ MESA</button>
        <button class="tab-btn" onclick="mudarAba('bestiario')">🐉 BESTIÁRIO</button>
        <button class="tab-btn" onclick="mudarAba('mundo')">📖 MUNDO E LORE</button>
    </div>

    <div class="conteudo-wrapper">
        <div class="mesa-sidebar">
            <div class="box-rpg" style="flex-shrink: 0; margin-bottom: 15px; padding: 15px;">
                <h2 class="section-title" style="font-size: 1.1rem;">CONTROLE DE COMBATE</h2>
                <button class="btn-acao" style="margin-bottom: 15px;" onclick="abrirModalIniciativa()">➕ INICIATIVA MANUAL</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="btn-acao green" style="grid-column: 1 / -1;" onclick="proximoTurno()">⏭️ PRÓXIMO TURNO</button>
                    <button class="btn-acao blue" onclick="ordenarIniciativa()">🔄 ORDENAR</button>
                    <button class="btn-acao red" onclick="limparIniciativa()">🗑️ LIMPAR</button>
                </div>
            </div>

            <div class="box-rpg" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <h2 class="section-title" style="font-size: 1.1rem;">ORDEM DE TURNOS</h2>
                <div id="lista-iniciativa" style="flex: 1; overflow-y: auto; padding-right: 5px;"></div>
            </div>
        </div>
        
        <div class="mesa-jogadores">
            <div id="tab-mesa" class="tab-content active">
                <div id="players-container"></div>
            </div>

            <div id="tab-bestiario" class="tab-content">
                <div style="text-align:center; margin-bottom: 25px;"><button class="btn-acao" style="width:auto; padding: 15px 40px;" onclick="abrirModalMonstro()">➕ CRIAR MONSTRO</button></div>
                <div id="lista-bestiario-container"></div>
            </div>

            <div id="tab-mundo" class="tab-content">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <div id="lista-capitulos" style="flex:1;"></div>
                    <button class="btn-acao" style="width:auto;" onclick="document.getElementById('modal-criar-capitulo').style.display='flex'">➕ NOVO</button>
                </div>
                <div id="area-edicao-capitulo" class="story-paper" style="display:none;">
                    <input type="text" id="titulo-capitulo-ativo" class="story-title-input" oninput="salvarTextoCapituloAtivo()">
                    <div class="story-divider"></div>
                    <textarea id="gm-capitulo-texto" class="story-body-input" oninput="salvarTextoCapituloAtivo()"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modal-sessao" class="modal-overlay">
    <div class="modal-content" style="max-width: 450px; text-align: center;">
        <span class="fechar-modal" onclick="document.getElementById('modal-sessao').style.display='none'">&times;</span>
        <h3 class="section-title">🖥️ SESSÃO</h3>
        <input type="text" id="gm-uid" class="form-input" style="margin-bottom: 20px;" placeholder="NOME DA SALA">
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <button class="btn-acao green" onclick="conectarSala(); document.getElementById('modal-sessao').style.display='none'">CONECTAR</button>
            <button class="btn-acao blue" onclick="forcarSincronizacao(); document.getElementById('modal-sessao').style.display='none'">PUXAR FICHAS</button>
        </div>
        <input type="text" id="link-convite" class="form-input" style="font-size: 0.8rem;" readonly>
        <button class="btn-acao" style="margin-top:10px;" onclick="copiarLink()">📋 COPIAR LINK</button>
    </div>
</div>

<div id="modal-iniciativa" class="modal-overlay">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <span class="fechar-modal" onclick="document.getElementById('modal-iniciativa').style.display='none'">&times;</span>
        <h3 class="section-title">⏱️ INICIATIVA</h3>
        <input type="text" id="ini-nome-modal" class="form-input" style="margin-bottom: 15px;" placeholder="Nome">
        <input type="number" id="ini-val-modal" class="form-input" style="margin-bottom: 25px;" placeholder="Valor">
        <button class="btn-acao green" onclick="addIniciativaManualModal()">✔️ ADICIONAR</button>
    </div>
</div>

<div id="modal-monstro" class="modal-overlay">
    <div class="modal-content">
        <span class="fechar-modal" onclick="fecharModais()">&times;</span>
        <h3 class="section-title">🐉 CRIAR MONSTRO</h3>
        <input type="text" id="mon-nome" class="form-input" style="margin-bottom:15px;" placeholder="Nome">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input type="number" id="mon-hp-atual" class="form-input" placeholder="HP Atual">
            <input type="number" id="mon-hp-max" class="form-input" placeholder="HP Max">
            <input type="number" id="mon-def" class="form-input" placeholder="Defesa">
        </div>
        <div class="grid-6">
            ${['FOR','DES','CON','INT','SAB','CAR'].map(a => `<div><label class="form-label-modal">${a}</label><input type="number" id="mon-${a.toLowerCase()}" class="form-input" value="0"></div>`).join('')}
        </div>
        <input type="text" id="mon-mov" class="form-input" style="margin-bottom:15px;" placeholder="Deslocamento">
        <div style="background:rgba(0,0,0,0.05); padding:15px; border-radius:8px; margin-bottom:15px;">
            <h4 style="margin-top:0;">⚔️ ATAQUE</h4>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="mon-atq-nome" class="form-input" placeholder="Nome">
                <input type="number" id="mon-atq-bonus" class="form-input" placeholder="Atq">
                <input type="text" id="mon-atq-dano" class="form-input" placeholder="Dano">
                <input type="text" id="mon-atq-crit" class="form-input" placeholder="Crit">
                <button class="btn-acao red" style="width:auto;" onclick="addMonstroAtaque()">+</button>
            </div>
            <div id="lista-temp-ataques" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
        </div>
        <button class="btn-acao" onclick="salvarMonstro()">💾 SALVAR MONSTRO</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let gmUid = "";
    let jogadores = {}; 
    let arrayIniciativa = [];
    let turnoAtualIndex = -1;
    let abaAtual = 'mesa';
    let dbBestiario = []; 
    let tempAtaques = []; 
    let gmCapitulos = []; 
    let capituloAtivoId = null;
    let diceState = 0;
    let animacaoGiro = null;
    let currentRollData = {};

    const DADO_IMG_URL = "https://blogger.googleusercontent.com/img/a/AVvXsEiftVk-yKnWxfthjGdnwF6awfHwHWNWsmhyKK4zNCLhhQkGaZrFRK6ccqywzrKpCZfj5XjphjWdPu0SlYHO1P4V3qxS1IOODUZ57HsAF8L5MhsYp-TUmIWnzJW97I18ccNp0DwiT6yoAL7acHi-cWVd0gAOFLAzGbaWFhuF9jwM5P9iJUs2S04wU8Xern4Y";

    window.onload = () => {
        let salaSalva = localStorage.getItem('gmUidSalva');
        if(salaSalva) conectarSala(salaSalva);
        let bSalvo = localStorage.getItem('rpgBestiario'); if(bSalvo) dbBestiario = JSON.parse(bSalvo);
        let hSalvo = localStorage.getItem('gm_capitulos_campanha'); if(hSalvo) gmCapitulos = JSON.parse(hSalvo);
        let iSalva = localStorage.getItem('rpgIniciativa'); if(iSalva) { arrayIniciativa = JSON.parse(iSalva); turnoAtualIndex = parseInt(localStorage.getItem('rpgIniciativaTurno')) || 0; renderIniciativa(); }
        renderizarBestiario();
        renderizarJogadores();
    };

    function mudarAba(aba) {
        abaAtual = aba;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.getElementById('tab-' + aba).style.display = 'block';
        if(aba === 'mesa') renderizarJogadores();
    }

    function conectarSala(uid = null) {
        gmUid = uid || document.getElementById('gm-uid').value.trim().toUpperCase();
        if(!gmUid) return;
        localStorage.setItem('gmUidSalva', gmUid);
        document.getElementById('link-convite').value = `${window.location.origin}/ficha.html?sala=${gmUid}`;
        socket.emit('solicitarEstadoSala', gmUid);
    }

    function copiarLink() { document.getElementById('link-convite').select(); document.execCommand("copy"); alert("Link Copiado!"); }
    function forcarSincronizacao() { socket.emit('solicitarEstadoSala', gmUid); }

    socket.on('estadoSalaCompleto', dados => { jogadores = dados; renderizarJogadores(); });
    socket.on('atualizarDados', data => {
        if(gmUid && data.uid.toUpperCase() === gmUid) {
            jogadores[data.dados.idUnico] = data.dados;
            renderizarJogadores();
        }
    });

    function renderizarJogadores() {
        const container = document.getElementById('players-container');
        container.innerHTML = '';
        
        Object.keys(jogadores).forEach(key => {
            let p = jogadores[key];
            let hpPerc = (p.hpAtual / p.hpMax) * 100;
            container.innerHTML += `
                <div class="player-card">
                    <div class="player-header">
                        ${p.img ? `<img src="${p.img}" class="player-img">` : `<div class="player-img">👤</div>`}
                        <div style="flex:1;">
                            <div class="player-name">${p.charName}</div>
                            <div class="player-realname">${p.playerName} • Nvl ${p.nivel}</div>
                        </div>
                        <div class="stat-badge" style="background:#455a64;">🛡️ ${p.defesa}</div>
                    </div>
                    <div class="barras-container">
                        <div class="bar-bg"><div class="bar-fill fill-hp" style="width:${hpPerc}%"></div><div class="bar-text">PV: ${p.hpAtual}/${p.hpMax}</div></div>
                    </div>
                    <textarea class="player-gm-notes" placeholder="Notas do Mestre..." onchange="jogadores['${key}'].gmNotes = this.value">${p.gmNotes || ''}</textarea>
                </div>`;
        });

        dbBestiario.filter(m => m.naMesa).forEach(m => {
            let hpPerc = (m.hpAtual / m.hpMax) * 100;
            let safeNome = m.nome.replace(/'/g, "\\'");
            container.innerHTML += `
                <div class="monstro-card monstro-fixado">
                    <button class="btn-kick" onclick="toggleMonstroMesa(${m.id}, false)">&times;</button>
                    <div class="player-header">
                        <div class="player-img" style="background:#b71c1c; color:#fff;">🐉</div>
                        <div style="flex:1;">
                            <div class="player-name">${m.nome}</div>
                            <div class="player-realname">MONSTRO</div>
                        </div>
                        <div class="stat-badge" style="background: linear-gradient(to bottom, #d32f2f, #b71c1c);">🛡️ ${m.def}</div>
                    </div>
                    <div class="barras-container">
                        <div class="bar-bg" style="height:32px; display:flex; align-items:center; justify-content:space-between; padding:0 8px;">
                            <div class="bar-fill fill-hp" style="position:absolute; left:0; width:${hpPerc}%; height:100%; z-index:0;"></div>
                            <button class="btn-hp-monstro" style="z-index:1" onclick="alterarHpMonstro(${m.id}, -1)">-</button>
                            <span class="bar-text" style="position:relative; z-index:1; font-size:1rem;">PV: ${m.hpAtual}/${m.hpMax}</span>
                            <button class="btn-hp-monstro" style="z-index:1" onclick="alterarHpMonstro(${m.id}, 1)">+</button>
                        </div>
                    </div>
                    <div class="monstro-stats-grid">
                        ${['FOR','DES','CON','INT','SAB','CAR'].map(a => `<div class="monstro-stat-box" onclick="rolarDadoMonstro('${safeNome} (${a})', ${m.attr[a.toLowerCase()]})"><span class="monstro-stat-label">${a}</span><span class="monstro-stat-val">${m.attr[a.toLowerCase()]}</span></div>`).join('')}
                    </div>
                    <div class="monstro-secao">
                        ${m.ataques.map(a => `
                            <div style="display:flex; gap:8px; margin-bottom:8px;">
                                <button class="btn-atq-monstro red" onclick="rolarAtaqueArmaGM('${safeNome}', '${a.nome}', ${a.bonus}, '${a.dano}', '${a.crit}')">🎲 ATQ +${a.bonus}</button>
                                <button class="btn-atq-monstro brown" onclick="rolarDanoGM('${safeNome}: ${a.nome}', '${a.dano}')">⚔️ DANO</button>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        });
    }

    function toggleMonstroMesa(id, checked) {
        let m = dbBestiario.find(x => x.id === id);
        if(m) { m.naMesa = checked; localStorage.setItem('rpgBestiario', JSON.stringify(dbBestiario)); renderizarJogadores(); renderizarBestiario(); }
    }

    function alterarHpMonstro(id, delta) {
        let m = dbBestiario.find(x => x.id === id);
        if(m) { m.hpAtual += delta; localStorage.setItem('rpgBestiario', JSON.stringify(dbBestiario)); renderizarJogadores(); }
    }

    function renderizarBestiario() {
        const container = document.getElementById('lista-bestiario-container');
        container.innerHTML = '';
        dbBestiario.forEach(m => {
            container.innerHTML += `
                <div class="monstro-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0">${m.nome}</h3>
                        <label class="toggle-fixar ${m.naMesa ? 'ativo' : ''}">
                            <input type="checkbox" ${m.naMesa ? 'checked' : ''} onchange="toggleMonstroMesa(${m.id}, this.checked)"> ${m.naMesa ? '📌 FIXADO' : '📌 FIXAR'}
                        </label>
                    </div>
                    <p style="margin:5px 0;">🛡️ DEF: ${m.def} | ❤️ HP: ${m.hpMax} | ⚔️ Atks: ${m.ataques.length}</p>
                    <button class="btn-acao red" style="padding:6px; font-size:0.8rem; margin-top:5px;" onclick="apagarMonstro(${m.id})">Apagar Monstro</button>
                </div>`;
        });
    }

    function apagarMonstro(id) { if(confirm("Apagar permanentemente?")) { dbBestiario = dbBestiario.filter(m => m.id !== id); localStorage.setItem('rpgBestiario', JSON.stringify(dbBestiario)); renderizarBestiario(); renderizarJogadores(); } }

    function abrirModalIniciativa() { document.getElementById('modal-iniciativa').style.display = 'flex'; }
    function addIniciativaManualModal() {
        let n = document.getElementById('ini-nome-modal').value;
        let v = document.getElementById('ini-val-modal').value;
        if(n && v) { arrayIniciativa.push({id:Date.now(), nome:n, val:parseInt(v)}); ordenarIniciativa(); }
        document.getElementById('modal-iniciativa').style.display = 'none';
    }

    function ordenarIniciativa() {
        arrayIniciativa.sort((a,b) => b.val - a.val);
        turnoAtualIndex = 0;
        renderIniciativa();
        localStorage.setItem('rpgIniciativa', JSON.stringify(arrayIniciativa));
    }

    function proximoTurno() {
        if(arrayIniciativa.length === 0) return;
        turnoAtualIndex = (turnoAtualIndex + 1) % arrayIniciativa.length;
        renderIniciativa();
    }

    function limparIniciativa() { arrayIniciativa = []; turnoAtualIndex = -1; renderIniciativa(); localStorage.removeItem('rpgIniciativa'); }

    function renderIniciativa() {
        const container = document.getElementById('lista-iniciativa');
        container.innerHTML = '';
        arrayIniciativa.forEach((item, idx) => {
            container.innerHTML += `
                <div class="ini-row ${idx === turnoAtualIndex ? 'ativo' : ''}">
                    <span class="ini-name">${item.nome}</span>
                    <div class="ini-val">${item.val}</div>
                </div>`;
        });
    }

    function rolarDadoMonstro(nome, bonus) { 
        currentRollData = { nome, bonus, isDano: false }; 
        iniciarGiroDado(nome, bonus, '#b71c1c'); 
    }
    function rolarAtaqueArmaGM(mon, atq, bonus, dano, crit) {
        currentRollData = { nome: mon+": "+atq, bonus, isDano: false, isAtaque: true, dano, crit };
        iniciarGiroDado(atq, bonus, '#b71c1c');
    }
    function rolarDanoGM(nome, exp) {
        currentRollData = { nome, expressao: exp, isDano: true };
        iniciarGiroDado(nome, 0, '#8b0000', true);
    }

    function iniciarGiroDado(nome, bonus, cor, isDano = false) {
        const box = document.getElementById('dice-result-container');
        const text = document.getElementById('dice-text');
        box.style.display = 'flex';
        box.style.borderColor = cor;
        box.classList.add('dice-pop-active');
        
        let frames = 0;
        animacaoGiro = setInterval(() => {
            text.innerHTML = `<span class="pop-pericia-nome">${nome}</span><span class="pop-total">...</span>`;
            if(++frames > 8) { clearInterval(animacaoGiro); finalizarRolagem(); }
        }, 50);
    }

    function finalizarRolagem() {
        const text = document.getElementById('dice-text');
        let res = 0, det = "", cat = "NORMAL";
        
        if(currentRollData.isDano) {
            res = Math.floor(Math.random() * 12) + 1; // Simplificado
            det = "Dano rolado"; cat = "DANO";
        } else {
            let dado = Math.floor(Math.random() * 20) + 1;
            res = dado + currentRollData.bonus;
            det = `d20(${dado}) + ${currentRollData.bonus}`;
        }

        text.innerHTML = `<span class="pop-pericia-nome">${currentRollData.nome}</span><span class="pop-total">${res}</span><div class="pop-categoria-badge" style="background:#b71c1c">${cat}</div><div class="pop-detalhes">${det}</div>`;
        document.getElementById('dice-overlay-click').style.display = 'block';
        document.getElementById('dice-overlay-click').onclick = () => {
            document.getElementById('dice-result-container').classList.remove('dice-pop-active');
            document.getElementById('dice-result-container').style.display = 'none';
            document.getElementById('dice-overlay-click').style.display = 'none';
        };

        socket.emit('player_dice_roll', { uid: gmUid, playerName: "👑 MESTRE", nomeRolagem: currentRollData.nome, resultadoFinal: res, detalhes: det, categoria: cat, corCategoria: "#b71c1c" });
    }

    function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
    function abrirModalMonstro() { tempAtaques = []; document.getElementById('modal-monstro').style.display = 'flex'; }
    function addMonstroAtaque() {
        let n = document.getElementById('mon-atq-nome').value;
        let b = document.getElementById('mon-atq-bonus').value;
        let d = document.getElementById('mon-atq-dano').value;
        let c = document.getElementById('mon-atq-crit').value;
        if(n && d) { tempAtaques.push({nome:n, bonus:parseInt(b), dano:d, crit:c}); renderTempAtq(); }
    }
    function renderTempAtq() {
        document.getElementById('lista-temp-ataques').innerHTML = tempAtaques.map(a => `<span style="background:#b71c1c;color:#fff;padding:2px 5px;border-radius:4px;">${a.nome}</span>`).join('');
    }
    function salvarMonstro() {
        let n = document.getElementById('mon-nome').value;
        let mon = {
            id: Date.now(), nome: n, hpAtual: parseInt(document.getElementById('mon-hp-atual').value), hpMax: parseInt(document.getElementById('mon-hp-max').value), def: parseInt(document.getElementById('mon-def').value),
            attr: {for:parseInt(document.getElementById('mon-for').value), des:parseInt(document.getElementById('mon-des').value), con:parseInt(document.getElementById('mon-con').value), int:parseInt(document.getElementById('mon-int').value), sab:parseInt(document.getElementById('mon-sab').value), car:parseInt(document.getElementById('mon-car').value)},
            ataques: [...tempAtaques], naMesa: false
        };
        dbBestiario.push(mon); localStorage.setItem('rpgBestiario', JSON.stringify(dbBestiario)); fecharModais(); renderizarBestiario();
    }
</script>
</body>
</html>
