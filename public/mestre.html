<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Mestre - RPG Total</title>
    <style>
        /* === FONTES E RESET === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto:wght@500;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Lora', serif; background-color: #170f0a; 
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicij-pbyNJBmSq1lNLeur-8lJkGfzOOurAvNt5ruR5j2KHWV9Qvqa90urImliVnN1Nvwm5ho0jTfeeNNjeUuSG-VDox7XojiJXx-6-2k4TJ5Or2PkHgGFgFwI4-ineXJaBO8nnt6Q9uchp7TobVp8W-HUKqTWhSU3Sg-uJFxZdvlYDy0kep7xEh0SrU5xt/w1519-h855/Gemini_Generated_Image_k9b6nuk9b6nuk9b6.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #3e2723; display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh;
        }

        /* === PAINEL PRINCIPAL (Estilo Pergaminho) === */
        .painel-mestre {
            background-color: #e3d8c1; 
            background-image: radial-gradient(circle at center, rgba(139,90,43,0.08) 0%, rgba(227, 216, 193, 1) 60%);
            border: 4px solid #4a2f1d; border-radius: 8px; width: 100%; max-width: 1200px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 50px rgba(139,90,43,0.2);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .painel-mestre::before { content: ''; position: absolute; top: 90px; left: 5%; right: 5%; height: 2px; background-color: rgba(74, 47, 29, 0.2); }

        .header-titulo { text-align: center; font-family: 'Cinzel', serif; font-weight: 900; font-size: 2.2rem; color: #4a2f1d; margin-top: 25px; margin-bottom: 25px; letter-spacing: 1px; }

        /* === ABAS DE NAVEGAÇÃO === */
        .tabs-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; position: relative; z-index: 10; padding: 0 20px; }
        .tab-btn {
            background-color: #f1e8d5; border: 2px solid #8b5a2b; border-radius: 6px; padding: 10px 25px; font-family: 'Cinzel', serif; font-weight: 800; font-size: 1rem;
            color: #4a2f1d; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 5px;
        }
        .tab-btn:hover { background-color: #eaddc4; transform: translateY(-2px); }
        .tab-btn.active { background-color: #9c2b2b; color: #f1e8d5; border-color: #4a2f1d; box-shadow: inset 0 3px 5px rgba(0,0,0,0.3); }

        /* === ESTRUTURA DE COLUNAS === */
        .conteudo-wrapper { display: flex; flex: 1; padding: 15px 25px; gap: 25px; height: calc(100vh - 200px); overflow: hidden; }
        .coluna-central { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 10px; }
        .coluna-log { width: 340px; flex-shrink: 0; background: rgba(241, 232, 213, 0.5); border: 2px solid rgba(139, 90, 43, 0.4); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }

        .section-title { font-family: 'Cinzel', serif; font-weight: 800; font-size: 1.2rem; color: #4a2f1d; text-align: center; border-bottom: 2px solid rgba(139, 90, 43, 0.4); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase;}

        /* === CAIXAS E FORMULÁRIOS === */
        .box-pergaminho { background-color: #f1e8d5; border: 2px solid #a68b6c; border-radius: 6px; padding: 20px; box-shadow: 2px 2px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; }
        .form-label { font-family: 'Roboto', sans-serif; font-size: 0.75rem; font-weight: 900; color: #4a2f1d; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #a68b6c; border-radius: 4px; background-color: #faf5eb; font-family: 'Lora', serif; font-size: 1rem; color: #3e2723; }
        .form-input:focus { border-color: #8b5a2b; outline: none; background-color: #fff; }
        .btn-acao { background-color: #4a2f1d; color: #f1e8d5; border: 2px solid #2d1c11; border-radius: 4px; padding: 10px 15px; font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap:5px;}
        .btn-acao:hover { background-color: #634028; }

        /* === LOG E INICIATIVA === */
        #dice-log-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .log-entry { background: rgba(0,0,0,0.8); border: 1px solid #4a2f1d; border-radius: 6px; padding: 12px; color: #f1e8d5; font-family: 'Roboto', sans-serif; }
        .log-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: #aaa; margin-bottom: 5px; }
        .log-result { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 900; margin-top: 5px; text-align: center; }
        
        .ini-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.6); border: 2px solid #a68b6c; padding: 12px; border-radius: 6px; margin-bottom: 8px; transition: 0.3s; }
        .ini-row.ativo { border-color: #b71c1c; background: rgba(183, 28, 28, 0.1); transform: scale(1.02); box-shadow: 0 4px 10px rgba(183, 28, 28, 0.2); border-width: 3px; }
        .ini-name { font-family: 'Cinzel'; font-weight: bold; font-size: 1.2rem; color: #4a2f1d; }
        .ini-val { font-family: 'Roboto'; font-weight: 900; font-size: 1.4rem; color: #b71c1c; background: #fff; padding: 4px 12px; border-radius: 4px; border: 1px solid #b71c1c; }

        /* === LISTA JOGADORES (MESA) === */
        #players-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .player-card { background: linear-gradient(145deg, #fdfbf7, #eaddc4); border: 2px solid #8b5a2b; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .player-header { display: flex; gap: 15px; align-items: center; }
        .player-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #4a2f1d; flex-shrink: 0; }
        .player-gm-notes { width: 100%; border: 1px dashed #a68b6c; background: rgba(255,255,255,0.5); padding: 8px; border-radius: 4px; font-family: 'Lora'; font-size: 0.8rem; color: #5c3a21; resize: vertical; height: 60px; }
        .barras-container { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.2); border: 2px solid #3e2723; border-radius: 10px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.4s; }
        .fill-hp { background-color: #b71c1c; } .fill-mp { background-color: #0d47a1; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Roboto'; font-size: 0.65rem; font-weight: 900; color: #fff; text-shadow: 1px 1px 1px #000; }

        .tab-content { display: none; animation: fadeIn 0.3s ease; } .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(139, 90, 43, 0.5); border-radius: 3px; }
    </style>
</head>
<body>

<div class="painel-mestre">
    <h1 class="header-titulo">MONITOR DA MESA</h1>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="mudarAba('mesa')">🛡️ MESA</button>
        <button class="tab-btn" onclick="mudarAba('iniciativa')">⏱️ INICIATIVA</button>
    </div>

    <div class="conteudo-wrapper">
        
        <div class="coluna-central">
            
            <div id="tab-mesa" class="tab-content active">
                <div class="box-pergaminho" style="text-align: center; margin-bottom: 20px;">
                    <h2 class="section-title">CONEXÃO DA SESSÃO</h2>
                    <div style="display: flex; gap: 10px; justify-content: center; max-width: 500px; margin: 0 auto;">
                        <input type="text" id="gm-uid" class="form-input" style="text-align: center; font-weight: bold; font-family: 'Cinzel';" placeholder="Insira o UID da Sala...">
                        <button class="btn-acao" style="width: auto;" onclick="conectarSala()">CONECTAR</button>
                    </div>
                </div>

                <div class="box-pergaminho">
                    <h2 class="section-title">JOGADORES CONECTADOS</h2>
                    <div id="players-container">
                        <p style="text-align:center; font-style:italic; color:#8b5a2b; font-size:0.9rem;" id="status-texto">Aguardando conexão...</p>
                    </div>
                </div>
            </div>

            <div id="tab-iniciativa" class="tab-content">
                <div class="box-pergaminho" style="margin-bottom: 20px;">
                    <h2 class="section-title">CONTROLE DE COMBATE</h2>
                    <p style="text-align:center; font-size:0.8rem; color:#5c3a21; font-family:'Roboto'; font-weight:bold;">A Iniciativa rolada pelos jogadores na ficha é adicionada e organizada automaticamente!</p>
                    <div class="form-row" style="margin-top:15px;">
                        <div class="form-group" style="flex:2;"><label class="form-label">Nome do Monstro/NPC</label><input type="text" id="ini-nome" class="form-input" placeholder="Ex: Goblin"></div>
                        <div class="form-group" style="flex:1;"><label class="form-label">Valor (D20)</label><input type="number" id="ini-val" class="form-input" placeholder="0"></div>
                        <div class="form-group" style="display:flex; align-items:flex-end;"><button class="btn-acao" onclick="addIniciativaManual()">+ ADICIONAR</button></div>
                    </div>
                    <div class="form-row" style="margin-top:15px;">
                        <button class="btn-acao" style="background:#0d47a1; border-color:#002171;" onclick="ordenarIniciativa()">🔄 RE-ORDENAR</button>
                        <button class="btn-acao" style="background:#2e7d32; border-color:#1b5e20;" onclick="proximoTurno()">⏭️ PRÓXIMO TURNO</button>
                        <button class="btn-acao" style="background:#b71c1c; border-color:#7f0000;" onclick="limparIniciativa()">🗑️ LIMPAR TUDO</button>
                    </div>
                </div>
                <div class="box-pergaminho">
                    <h2 class="section-title">ORDEM DE TURNOS</h2>
                    <div id="lista-iniciativa" style="display:flex; flex-direction:column; gap:5px;"></div>
                </div>
            </div>

        </div>

        <div class="coluna-log">
            <h2 class="section-title" style="margin-bottom: 20px;">LOG DE ROLAGENS</h2>
            <div id="dice-log-container">
                <p style="text-align:center; font-style:italic; color:#8b5a2b; font-size:0.85rem; margin-top:50%;">Aguardando rolagens...</p>
            </div>
        </div>

    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let gmUid = "";
    let jogadores = {}; 
    
    let arrayIniciativa = [];
    let turnoAtualIndex = -1;
    let abaAtual = 'mesa';

    window.onload = () => {
        let salaSalva = localStorage.getItem('gmUidSalva');
        if (salaSalva) { document.getElementById('gm-uid').value = salaSalva; conectarSala(salaSalva); }
    };

    // === NAVEGAÇÃO DE ABAS ===
    function mudarAba(aba) {
        abaAtual = aba;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if(aba === 'mesa') {
            document.getElementById('tab-mesa').classList.add('active');
        } else if (aba === 'iniciativa') {
            document.getElementById('tab-iniciativa').classList.add('active');
            renderIniciativa();
        }
    }

    // === CONEXÃO DO MESTRE E JOGADORES ===
    function conectarSala(uidAutomatica = null) {
        gmUid = uidAutomatica || document.getElementById('gm-uid').value.trim();
        if(!gmUid) return alert("Digite um UID de sala!");
        localStorage.setItem('gmUidSalva', gmUid);
        document.getElementById('status-texto').innerText = `Conectado à sala: ${gmUid}. Carregando...`;
        socket.emit('solicitarEstadoSala', gmUid);
    }

    socket.on('estadoSalaCompleto', function(dadosDaSala) { jogadores = dadosDaSala; if(abaAtual==='mesa') renderizarJogadores(); });

    socket.on('atualizarDados', function(data) {
        if(gmUid && data.uid && data.uid.trim() !== gmUid.trim()) return;
        let j = data.dados; let chave = j.idUnico; if (!chave) return; 
        j.charName = j.charName || "Personagem sem nome";
        
        // Preserva anotações do mestre
        if(jogadores[chave] && jogadores[chave].gmNotes) j.gmNotes = jogadores[chave].gmNotes;
        
        jogadores[chave] = j;
        if (gmUid && abaAtual === 'mesa') renderizarJogadores();
    });

    function salvarNotaGM(chave, valor) {
        if(jogadores[chave]) jogadores[chave].gmNotes = valor;
    }

    function renderizarJogadores() {
        const container = document.getElementById('players-container');
        let chaves = Object.keys(jogadores);
        if(chaves.length === 0) {
            container.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#8b5a2b; font-style:italic;">A sala está vazia.</p>';
            return;
        }
        
        container.innerHTML = ''; 
        
        chaves.forEach(key => {
            let p = jogadores[key];
            let imgHtml = p.img ? `<img src="${p.img}" class="player-img">` : `<div class="player-img" style="background:#e3d8c1; display:flex; align-items:center; justify-content:center; font-size:1.5rem;">👤</div>`;
            let hpPerc = Math.max(0, Math.min(100, ((parseFloat(p.hpAtual)||0) / (parseFloat(p.hpMax)||1)) * 100));
            let mpPerc = Math.max(0, Math.min(100, ((parseFloat(p.mpAtual)||0) / (parseFloat(p.mpMax)||1)) * 100));
            let notes = p.gmNotes || '';
            
            container.innerHTML += `
                <div class="player-card">
                    <div class="player-header">
                        ${imgHtml}
                        <div style="flex:1;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div><div class="player-name">${p.charName}</div><div class="player-realname">${p.playerName || 'Jogador'} • Nvl ${p.nivel || 1}</div></div>
                                <div class="stat-badge" style="background:#455a64;" title="Defesa">🛡️ ${p.defesa || 10}</div>
                            </div>
                        </div>
                    </div>
                    <div class="barras-container">
                        <div class="bar-bg"><div class="bar-fill fill-hp" style="width: ${hpPerc}%;"></div><div class="bar-text">PV: ${p.hpAtual} / ${p.hpMax}</div></div>
                        <div class="bar-bg"><div class="bar-fill fill-mp" style="width: ${mpPerc}%;"></div><div class="bar-text">PM: ${p.mpAtual} / ${p.mpMax}</div></div>
                    </div>
                    <textarea class="player-gm-notes" placeholder="Anotações do Mestre (Secreto)..." onchange="salvarNotaGM('${key}', this.value)">${notes}</textarea>
                </div>
            `;
        });
    }

    // === INICIATIVA (Automática e Manual) ===
    function addIniciativaManual() {
        let nome = document.getElementById('ini-nome').value.trim();
        let val = parseInt(document.getElementById('ini-val').value) || 0;
        if(!nome) return;
        addIniciativaInterna(nome, val);
        document.getElementById('ini-nome').value = ''; document.getElementById('ini-val').value = '';
    }

    function addIniciativaInterna(nome, val) {
        // Se o personagem já estiver na lista de iniciativa, atualiza o valor
        let existente = arrayIniciativa.find(i => i.nome.toLowerCase() === nome.toLowerCase());
        if(existente) {
            existente.val = val;
        } else {
            arrayIniciativa.push({ id: Date.now() + Math.random(), nome: nome, val: val });
        }
        ordenarIniciativa();
    }

    function ordenarIniciativa() {
        arrayIniciativa.sort((a, b) => b.val - a.val);
        turnoAtualIndex = arrayIniciativa.length > 0 ? 0 : -1;
        if(abaAtual === 'iniciativa') renderIniciativa();
    }
    
    function proximoTurno() {
        if(arrayIniciativa.length === 0) return;
        turnoAtualIndex++;
        if(turnoAtualIndex >= arrayIniciativa.length) turnoAtualIndex = 0;
        renderIniciativa();
    }
    
    function limparIniciativa() { arrayIniciativa = []; turnoAtualIndex = -1; renderIniciativa(); }
    function removerIni(id) { arrayIniciativa = arrayIniciativa.filter(i => i.id !== id); ordenarIniciativa(); }
    
    function renderIniciativa() {
        const container = document.getElementById('lista-iniciativa'); container.innerHTML = '';
        if(arrayIniciativa.length === 0) { container.innerHTML = '<p style="text-align:center; color:#8b5a2b; font-style:italic; padding-top:10px;">Nenhum combatente no momento.</p>'; return; }
        
        arrayIniciativa.forEach((item, index) => {
            let isAtivo = index === turnoAtualIndex ? 'ativo' : '';
            container.innerHTML += `
                <div class="ini-row ${isAtivo}">
                    <div class="ini-name">${index === turnoAtualIndex ? '⚔️ ' : ''}${item.nome}</div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <div class="ini-val">${item.val}</div>
                        <button onclick="removerIni(${item.id})" style="background:transparent; border:none; color:#b71c1c; cursor:pointer; font-size:1.5rem; padding:0;">&times;</button>
                    </div>
                </div>
            `;
        });
    }

    // === LOG DE ROLAGENS (Ouve o jogador e capta Iniciativa) ===
    socket.on('player_dice_roll', function(roll) {
        if(gmUid && roll.uid && roll.uid !== gmUid) return;

        // Se for uma rolagem de Iniciativa, cadastra automaticamente!
        if (roll.nomeRolagem && roll.nomeRolagem.toLowerCase() === 'iniciativa') {
            addIniciativaInterna(roll.playerName || 'Jogador', parseInt(roll.resultadoFinal) || 0);
        }

        const logContainer = document.getElementById('dice-log-container');
        if (logContainer.querySelector('p')) logContainer.innerHTML = ''; // Remove o "Aguardando"
        
        let color = roll.corCategoria || "#2e7d32";
        let shadow = roll.isCritico || roll.isDesastre ? `box-shadow: inset 0 0 10px ${color}, 0 0 5px ${color}; border-color:${color};` : '';

        let entry = `<div class="log-entry" style="${shadow}"><div class="log-header"><span><strong>${roll.playerName || 'Jogador'}</strong></span><span style="color:${color}; font-weight:bold; font-family:'Cinzel';">${roll.categoria}</span></div><div style="font-family:'Cinzel'; font-weight:bold; color:#ff9100; font-size: 0.9rem;">${roll.nomeRolagem}</div><div class="log-result" style="color: ${color};">${roll.resultadoFinal}</div><div style="font-size:0.7rem; color:#888; text-align:center; margin-top:2px;">${roll.detalhes}</div></div>`;
        
        logContainer.innerHTML = entry + logContainer.innerHTML;
        if(logContainer.children.length > 40) logContainer.removeChild(logContainer.lastChild);
    });
</script>

</body>
</html>
