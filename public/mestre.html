<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Mestre - RPG</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text: #e0e0e0;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        /* Área de Adicionar UID */
        .setup-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        input {
            background: #2d2d2d;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #9965f4;
        }

        /* Grid de Fichas dos Jogadores */
        #painel-jogadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .ficha-monitor {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .ficha-monitor h3 {
            margin-top: 0;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .dado-log {
            background: #2d2d2d;
            padding: 5px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-top: 10px;
            border-left: 3px solid var(--primary);
        }

        .uid-tag {
            font-size: 0.8em;
            color: #888;
            float: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Escudo do Mestre</h1>

        <div class="setup-section">
            <input type="text" id="input-uid" placeholder="Digite o UID do Jogador">
            <button onclick="adicionarJogador()">Adicionar Jogador</button>
        </div>

        <div id="painel-jogadores">
            </div>
    </div>

    <script>
        const socket = io();
        const jogadoresAtivos = {};

        function adicionarJogador() {
            const uid = document.getElementById('input-uid').value.toUpperCase().trim();
            if (uid && !jogadoresAtivos[uid]) {
                criarCardJogador(uid);
                document.getElementById('input-uid').value = '';
            }
        }

        function criarCardJogador(uid) {
            const painel = document.getElementById('painel-jogadores');
            
            const card = document.createElement('div');
            card.className = 'ficha-monitor';
            card.id = `card-${uid}`;
            card.innerHTML = `
                <span class="uid-tag">#${uid}</span>
                <h3 id="nome-${uid}">Aguardando dados...</h3>
                <div class="status-grid">
                    <div>❤️ PV: <span id="pv-${uid}">--</span></div>
                    <div>✨ PM: <span id="pm-${uid}">--</span></div>
                    <div>🛡️ DEF: <span id="def-${uid}">--</span></div>
                    <div>🎯 NÍVEL: <span id="lvl-${uid}">--</span></div>
                </div>
                <div id="log-${uid}" class="dado-log">Nenhuma rolagem ainda.</div>
            `;
            
            painel.appendChild(card);
            jogadoresAtivos[uid] = true;
        }

        // Escutar atualizações do servidor
        socket.on('dadosAtualizados', (dados) => {
            if (jogadoresAtivos[dados.uid]) {
                document.getElementById(`nome-${dados.uid}`).innerText = dados.nome || "Sem Nome";
                document.getElementById(`pv-${dados.uid}`).innerText = dados.pv;
                document.getElementById(`pm-${dados.uid}`).innerText = dados.pm;
                document.getElementById(`def-${dados.uid}`).innerText = dados.defesa;
                document.getElementById(`lvl-${dados.uid}`).innerText = dados.nivel;
            }
        });

        // Escutar rolagens de dados
        socket.on('player_dice_roll', (log) => {
            if (jogadoresAtivos[log.uid]) {
                const logDiv = document.getElementById(`log-${log.uid}`);
                logDiv.innerHTML = `🎲 <strong>${log.pericia}:</strong> ${log.resultado} (d20:${log.d20} + mod:${log.mod})`;
            }
        });
    </script>
</body>
</html>
