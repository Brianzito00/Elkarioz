<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escudo do Mestre - RPG</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lora:wght@400;700&family=Roboto:wght@700;900&display=swap');

        * { box-sizing: border-box; }
        body {
            font-family: 'Lora', serif; background-color: #170f0a;
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicij-pbyNJBmSq1lNLeur-8lJkGfzOOurAvNt5ruR5j2KHWV9Qvqa90urImliVnN1Nvwm5ho0jTfeeNNjeUuSG-VDox7XojiJXx-6-2k4TJ5Or2PkHgGFgFwI4-ineXJaBO8nnt6Q9uchp7TobVp8W-HUKqTWhSU3Sg-uJFxZdvlYDy0kep7xEh0SrU5xt/w1519-h855/Gemini_Generated_Image_k9b6nuk9b6nuk9b6.png');
            background-size: cover; background-attachment: fixed; color: #3e2723; margin: 0; padding: 20px;
        }

        .master-container {
            background-color: rgba(244, 235, 216, 0.95); padding: 30px; border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); border: 2px solid #8b5a2b;
            outline: 4px solid rgba(92, 58, 33, 0.8); outline-offset: -10px; max-width: 1200px; margin: auto;
        }

        .header-mestre { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #8b5a2b; }
        .header-mestre h1 { font-family: 'Cinzel', serif; color: #5c3a21; text-transform: uppercase; margin: 10px; }

        .conn-box {
            display: flex; justify-content: center; gap: 10px; background: rgba(139, 90, 43, 0.1);
            padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px dashed #8b5a2b;
        }

        input { font-family: 'Cinzel'; font-weight: bold; padding: 8px; border: 2px solid #3e2723; text-align: center; width: 180px; }
        .btn-add { font-family: 'Cinzel'; background: #b71c1c; color: white; border: 2px solid #3e2723; padding: 8px 20px; cursor: pointer; font-weight: 900; }

        #grid-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }

        .player-card {
            background: rgba(255, 255, 255, 0.6); border: 2px solid #8b5a2b; padding: 15px;
            border-radius: 4px; position: relative; transition: 0.3s;
        }

        .player-header { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
        .player-img { width: 70px; height: 70px; object-fit: cover; border: 2px solid #3e2723; background: #ccc; }
        .player-name { font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.2rem; color: #5c3a21; text-transform: uppercase; }

        .uid-badge { position: absolute; top: -10px; right: 10px; background: #b71c1c; color: white; padding: 2px 8px; font-weight: 900; font-size: 0.8rem; border: 1px solid #3e2723; }
        .btn-remove { position: absolute; top: 20px; right: 10px; cursor: pointer; color: #b71c1c; font-weight: bold; border: none; background: none; }

        .status-mini-bar { margin-bottom: 10px; }
        .bar-label { font-family: 'Roboto'; font-size: 0.7rem; font-weight: 900; display: flex; justify-content: space-between; margin-bottom: 2px; }
        .track { height: 14px; background: rgba(0,0,0,0.2); border: 1px solid #000; border-radius: 7px; overflow: hidden; }
        .fill { height: 100%; transition: width 0.4s ease; }
        .vida-color { background: #b71c1c; }
        .mana-color { background: #0d47a1; }

        .dice-log { margin-top: 10px; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 4px; border-left: 4px solid #b71c1c; min-height: 50px; }
        .dice-val { font-family: 'Cinzel'; font-size: 1.4rem; font-weight: 900; }
    </style>
</head>
<body>

<div class="master-container">
    <div class="header-mestre"><h1>Escudo do Mestre</h1></div>
    <div class="conn-box">
        <input type="text" id="uid-input" placeholder="DIGITE A UID">
        <button class="btn-add" onclick="conectarJogador()">ADICIONAR</button>
    </div>
    <div id="grid-players"></div>
</div>

<script>
    const socket = io();
    let jogadoresMonitorados = JSON.parse(localStorage.getItem('mestre_uids')) || [];

    // Inicializar jogadores salvos
    window.onload = () => {
        jogadoresMonitorados.forEach(uid => criarCard(uid));
    };

    function conectarJogador() {
        const uid = document.getElementById('uid-input').value.toUpperCase().trim();
        if (uid && !jogadoresMonitorados.includes(uid)) {
            jogadoresMonitorados.push(uid);
            localStorage.setItem('mestre_uids', JSON.stringify(jogadoresMonitorados));
            criarCard(uid);
            document.getElementById('uid-input').value = '';
        }
    }

    function removerJogador(uid) {
        jogadoresMonitorados = jogadoresMonitorados.filter(id => id !== uid);
        localStorage.setItem('mestre_uids', JSON.stringify(jogadoresMonitorados));
        document.getElementById(`card-${uid}`).remove();
    }

    function criarCard(uid) {
        const grid = document.getElementById('grid-players');
        const card = document.createElement('div');
        card.className = 'player-card';
        card.id = `card-${uid}`;
        card.innerHTML = `
            <div class="uid-badge">${uid}</div>
            <button class="btn-remove" onclick="removerJogador('${uid}')">✖</button>
            <div class="player-header">
                <img id="img-${uid}" src="" class="player-img" style="display:none;">
                <div id="ph-${uid}" class="player-img" style="display:flex; align-items:center; justify-content:center;">?</div>
                <div>
                    <div id="name-${uid}" class="player-name">BUSCANDO...</div>
                    <div id="sub-${uid}" style="font-size:0.75rem; font-weight:bold; color:#8b5a2b;">Aguardando dados...</div>
                </div>
            </div>
            <div class="status-mini-bar">
                <div class="bar-label"><span>VIDA</span> <span id="txt-pv-${uid}">0/0</span></div>
                <div class="track"><div id="bar-pv-${uid}" class="fill vida-color" style="width:0%"></div></div>
            </div>
            <div class="status-mini-bar">
                <div class="bar-label"><span>MANA</span> <span id="txt-pm-${uid}">0/0</span></div>
                <div class="track"><div id="bar-pm-${uid}" class="fill mana-color" style="width:0%"></div></div>
            </div>
            <div id="log-${uid}" class="dice-log">Aguardando rolagens...</div>
        `;
        grid.appendChild(card);
    }

    socket.on('dadosAtualizados', (payload) => {
        const uid = payload.uid;
        if (jogadoresMonitorados.includes(uid)) {
            const d = payload.dados;
            document.getElementById(`name-${uid}`).innerText = d.charName || "SEM NOME";
            document.getElementById(`sub-${uid}`).innerText = `NÍVEL: ${d.nivel || 1} | DEFESA: ${d.defesa || 10}`;
            
            if(d.img) {
                document.getElementById(`img-${uid}`).src = d.img;
                document.getElementById(`img-${uid}`).style.display = 'block';
                document.getElementById(`ph-${uid}`).style.display = 'none';
            }

            const pvP = (d.hpAtual / (d.hpMax || 1)) * 100;
            const pmP = (d.mpAtual / (d.mpMax || 1)) * 100;
            document.getElementById(`bar-pv-${uid}`).style.width = Math.min(pvP, 100) + "%";
            document.getElementById(`bar-pm-${uid}`).style.width = Math.min(pmP, 100) + "%";
            document.getElementById(`txt-pv-${uid}`).innerText = `${d.hpAtual}/${d.hpMax}`;
            document.getElementById(`txt-pm-${uid}`).innerText = `${d.mpAtual}/${d.mpMax}`;
        }
    });

    socket.on('player_dice_roll', (log) => {
        if (jogadoresMonitorados.includes(log.uid)) {
            const logBox = document.getElementById(`log-${log.uid}`);
            const cor = log.corCategoria || "#b71c1c";
            logBox.style.borderLeftColor = cor;
            logBox.innerHTML = `
                <div style="font-weight:900; color:#5c3a21; font-size:0.7rem; text-transform:uppercase;">${log.nomeRolagem}</div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="dice-val" style="color:${cor}">${log.resultadoFinal}</span>
                    <span style="background:${cor}; color:white; padding:1px 6px; border-radius:3px; font-size:0.6rem; font-weight:900;">${log.categoria}</span>
                </div>
                <div style="font-size:0.65rem; color:#666; font-weight:bold;">${log.detalhes}</div>
            `;
        }
    });
</script>
</body>
</html>
