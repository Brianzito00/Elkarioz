<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay de Stream - RPG Total</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,600;1,400&family=Roboto:wght@700;900&display=swap');

        /* Fundo transparente essencial para o OBS */
        body {
            margin: 0;
            padding: 20px;
            background-color: transparent; 
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        /* Container Principal */
        .widget-container {
            display: flex;
            align-items: center;
            position: relative;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.5));
        }

        /* Avatar do Personagem */
        .avatar-box {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #24185f;
            background-color: #1a1535;
            overflow: hidden;
            position: relative;
            z-index: 10; /* Fica por cima das barras */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 0 2px #000;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Container das 3 Barras */
        .bars-container {
            display: flex;
            flex-direction: column;
            margin-left: -20px; /* Puxa as barras para debaixo do avatar */
            z-index: 5;
            width: 360px;
        }

        /* Estilo base de todas as barras */
        .bar-row {
            border: 4px solid #000;
            border-left: none; /* A borda esquerda fica escondida no avatar */
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 0 4px 4px 0;
        }

        /* Barra do Topo (Nome e Nível) */
        .top-bar {
            background: linear-gradient(90deg, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.76) 75%, rgba(0,0,0,0) 100%);
            height: 70px;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 18px 7px 35px;
            border: none;
            border-bottom: 4px solid #fff;
            border-radius: 0;
            clip-path: none;
            overflow: visible;
            box-sizing: border-box;
        }

        .identity-block {
            min-width: 0;
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 3px;
        }

        .char-name {
            max-width: 270px;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -1px;
            white-space: nowrap;
            text-overflow: ellipsis;
            -webkit-text-stroke: 1px #24185f;
            text-shadow: 3px 3px 0 #120b35, -1px -1px 0 #120b35, 1px -1px 0 #120b35, -1px 1px 0 #120b35;
        }

        .char-class {
            display: inline-block;
            max-width: 250px;
            overflow: hidden;
            padding: 2px 7px;
            background: #24185f;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* Painel de conexao: usa a mesma paleta do overlay e some no modo de exibicao. */
        .connection-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            width: min(480px, calc(100vw - 40px));
            box-sizing: border-box;
            padding: 20px;
            border: 4px solid #000;
            border-radius: 10px;
            background: rgba(253, 251, 247, 0.97);
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
            color: #170f0a;
            font-family: 'Roboto', sans-serif;
        }

        .connection-panel.hidden { display: none; }
        .connection-title { margin: 0 0 5px; font-family: 'Cinzel', serif; font-size: 1.2rem; }
        .connection-help { margin: 0 0 15px; color: #5c3a21; font-size: 0.8rem; line-height: 1.4; }
        .connection-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        .connection-field { min-width: 0; }
        .connection-field.full { grid-column: 1 / -1; }
        .connection-field label { display: block; margin: 0 0 5px; font-family: 'Cinzel', serif; font-weight: 900; font-size: 0.72rem; }
        .connection-input, .connection-select {
            width: 100%;
            box-sizing: border-box;
            min-height: 42px;
            padding: 9px 11px;
            border: 2px solid #3e2723;
            border-radius: 5px;
            background: #fff;
            color: #170f0a;
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
        }
        .connection-button {
            align-self: end;
            min-height: 42px;
            padding: 9px 15px;
            border: 2px solid #000;
            border-radius: 5px;
            background: #b82326;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            cursor: pointer;
        }
        .connection-button:hover { filter: brightness(1.12); }
        .connection-button.secondary { background: #143d8d; }
        .connection-status {
            grid-column: 1 / -1;
            min-height: 18px;
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(0,0,0,0.08);
            font-size: 0.8rem;
            font-weight: 700;
        }
        .connection-status.ok { background: rgba(46,125,50,0.14); color: #1b5e20; }
        .connection-status.error { background: rgba(183,28,28,0.14); color: #8e1010; }
        .config-toggle {
            display: none;
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 101;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 2px solid #000;
            border-radius: 50%;
            background: rgba(253,251,247,0.92);
            color: #170f0a;
            cursor: pointer;
            font-size: 1rem;
        }
        .config-toggle.visible { display: block; }

        @media (max-width: 560px) {
            body { padding: 10px; }
            .connection-panel { top: 10px; left: 10px; width: calc(100vw - 20px); }
            .connection-grid { grid-template-columns: 1fr; }
            .connection-button { width: 100%; }
        }

    </style>
</head>
<body>

    <button type="button" class="config-toggle" id="config-toggle" aria-label="Configurar overlay" title="Configurar overlay">⚙</button>

    <section class="connection-panel" id="connection-panel" aria-label="Conexao do overlay">
        <h1 class="connection-title">CONECTAR OVERLAY</h1>
        <p class="connection-help">Informe a mesa, conecte e escolha um personagem da lista ou digite o UID de 4 dígitos mostrado na ficha.</p>

        <div class="connection-grid">
            <div class="connection-field">
                <label for="mesa-input">MESA / UID DO MESTRE</label>
                <input class="connection-input" id="mesa-input" type="text" autocomplete="off" placeholder="EX: MESA1">
            </div>
            <button type="button" class="connection-button" id="connect-room-button">CONECTAR À MESA</button>

            <div class="connection-field full">
                <label for="players-select">PERSONAGENS ENCONTRADOS</label>
                <select class="connection-select" id="players-select" disabled>
                    <option value="">Conecte a uma mesa para listar os personagens</option>
                </select>
            </div>

            <div class="connection-field">
                <label for="character-uid-input">UID DO PERSONAGEM (4 DÍGITOS)</label>
                <input class="connection-input" id="character-uid-input" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="EX: 4827">
            </div>
            <button type="button" class="connection-button secondary" id="load-character-button">CARREGAR PERSONAGEM</button>

            <div class="connection-status" id="connection-status" role="status">Aguardando configuração.</div>
        </div>
    </section>

    <div class="widget-container" id="widget" style="display: none;">
        
        <div class="avatar-box">
            <img id="o-img" src="https://via.placeholder.com/150" alt="Avatar">
        </div>

        <div class="bars-container">
            
            <div class="bar-row top-bar">
                <div class="identity-block">
                    <span class="char-name" id="o-nome">Carregando...</span>
                    <span class="char-class" id="o-classe">Aventureiro</span>
                </div>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const elements = {
            panel: document.getElementById('connection-panel'),
            toggle: document.getElementById('config-toggle'),
            mesa: document.getElementById('mesa-input'),
            uid: document.getElementById('character-uid-input'),
            players: document.getElementById('players-select'),
            status: document.getElementById('connection-status'),
            widget: document.getElementById('widget')
        };

        let salaAtual = normalizarSala(urlParams.get('sala') || localStorage.getItem('overlaySala') || '');
        let uidPersonagem = normalizarUid(urlParams.get('uid') || localStorage.getItem('overlayPersonagemUid') || '');
        const nomeLegado = (urlParams.get('nome') || '').trim().toLowerCase();
        let jogadoresDaSala = {};

        elements.mesa.value = salaAtual;
        elements.uid.value = uidPersonagem;

        document.getElementById('connect-room-button').addEventListener('click', () => conectarMesa(false));
        document.getElementById('load-character-button').addEventListener('click', carregarPersonagemSelecionado);
        elements.players.addEventListener('change', function() {
            if (this.value) elements.uid.value = normalizarUid(this.value);
        });
        elements.uid.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 4);
        });
        elements.mesa.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') conectarMesa(false);
        });
        elements.uid.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') carregarPersonagemSelecionado();
        });
        elements.toggle.addEventListener('click', abrirConfiguracao);

        socket.on('connect', () => {
            if (salaAtual) conectarMesa(true);
            else definirStatus('Informe a mesa para começar.');
        });

        socket.on('disconnect', () => {
            definirStatus('Conexão com o servidor perdida. Tentando reconectar...', 'error');
        });

        socket.on('estadoSalaCompleto', function(jogadores) {
            jogadoresDaSala = jogadores && typeof jogadores === 'object' ? jogadores : {};
            preencherListaPersonagens();

            if (!uidPersonagem && nomeLegado) {
                const legado = Object.values(jogadoresDaSala).find(p => p && p.charName && p.charName.toLowerCase() === nomeLegado);
                if (legado) {
                    uidPersonagem = normalizarUid(legado.idUnico);
                    elements.uid.value = uidPersonagem;
                }
            }

            if (uidPersonagem) mostrarPersonagemPorUid(uidPersonagem, false);
            else definirStatus(`Mesa ${salaAtual} conectada. Escolha um personagem.`, 'ok');
        });

        socket.on('atualizarDados', function(data) {
            if (!data || !data.uid || !data.dados || !salaAtual) return;
            if (normalizarSala(data.uid) !== salaAtual) return;

            const uidRecebido = normalizarUid(data.dados.idUnico);
            if (!uidRecebido) return;

            jogadoresDaSala[uidRecebido] = data.dados;
            preencherListaPersonagens();
            if (uidPersonagem === uidRecebido) desenharPersonagem(data.dados);
        });

        function normalizarSala(valor) {
            return String(valor || '').trim().toUpperCase();
        }

        function normalizarUid(valor) {
            const somenteNumeros = String(valor || '').replace(/\D/g, '');
            return somenteNumeros.length === 4 ? somenteNumeros : '';
        }

        function conectarMesa(automatico) {
            const novaSala = normalizarSala(elements.mesa.value || salaAtual);
            if (!novaSala) {
                abrirConfiguracao();
                definirStatus('Digite o nome ou UID da mesa.', 'error');
                return;
            }

            salaAtual = novaSala;
            elements.mesa.value = salaAtual;
            const uidInformado = normalizarUid(elements.uid.value);
            if (uidInformado) {
                uidPersonagem = uidInformado;
                localStorage.setItem('overlayPersonagemUid', uidPersonagem);
            }
            jogadoresDaSala = {};
            elements.players.disabled = true;
            elements.players.innerHTML = '<option value="">Buscando personagens...</option>';
            localStorage.setItem('overlaySala', salaAtual);
            definirStatus(`Conectando à mesa ${salaAtual}...`);

            if (socket.connected) socket.emit('solicitarEstadoSala', salaAtual);
            else if (!automatico) definirStatus('Aguardando conexão com o servidor...', 'error');
        }

        function preencherListaPersonagens() {
            const jogadores = Object.entries(jogadoresDaSala)
                .map(([chave, dados]) => ({
                    chave: normalizarUid(dados && dados.idUnico) || normalizarUid(chave),
                    dados: dados || {}
                }))
                .filter(item => item.chave)
                .sort((a, b) => String(a.dados.charName || '').localeCompare(String(b.dados.charName || ''), 'pt-BR'));

            elements.players.innerHTML = '';
            const inicial = document.createElement('option');
            inicial.value = '';
            inicial.textContent = jogadores.length ? 'Selecione um personagem' : 'Nenhum personagem encontrado na mesa';
            elements.players.appendChild(inicial);

            jogadores.forEach(item => {
                const option = document.createElement('option');
                option.value = item.chave;
                option.textContent = `${item.dados.charName || 'Sem nome'} — UID ${item.chave}`;
                option.selected = item.chave === uidPersonagem;
                elements.players.appendChild(option);
            });

            elements.players.disabled = jogadores.length === 0;
        }

        function carregarPersonagemSelecionado() {
            const uidDigitado = normalizarUid(elements.uid.value || elements.players.value);
            if (!uidDigitado) {
                definirStatus('Informe ou selecione um UID válido de 4 dígitos.', 'error');
                return;
            }

            uidPersonagem = uidDigitado;
            elements.uid.value = uidPersonagem;
            localStorage.setItem('overlayPersonagemUid', uidPersonagem);

            if (!salaAtual) {
                conectarMesa(false);
                return;
            }

            mostrarPersonagemPorUid(uidPersonagem, true);
        }

        function encontrarPersonagem(uid) {
            return Object.entries(jogadoresDaSala).find(([chave, dados]) => {
                return normalizarUid(chave) === uid || normalizarUid(dados && dados.idUnico) === uid;
            });
        }

        function mostrarPersonagemPorUid(uid, solicitarSeFaltar) {
            const encontrado = encontrarPersonagem(uid);
            if (!encontrado) {
                elements.widget.style.display = 'none';
                abrirConfiguracao();
                definirStatus(`UID ${uid} não foi encontrado na mesa ${salaAtual}.`, 'error');
                if (solicitarSeFaltar && socket.connected) socket.emit('solicitarEstadoSala', salaAtual);
                return false;
            }

            desenharPersonagem(encontrado[1]);
            salvarConfiguracaoNaUrl();
            fecharConfiguracao();
            return true;
        }

        function desenharPersonagem(p) {
            if (!p) return;
            const imagem = p.img && String(p.img).trim() ? p.img : 'https://via.placeholder.com/150';
            document.getElementById('o-img').src = imagem;
            document.getElementById('o-nome').innerText = p.charName || 'Sem nome';
            document.getElementById('o-classe').innerText = p.classe || p.class || 'Aventureiro';
            elements.widget.style.display = 'flex';
            definirStatus(`${p.charName || 'Personagem'} (UID ${uidPersonagem}) carregado.`, 'ok');
        }

        function salvarConfiguracaoNaUrl() {
            const params = new URLSearchParams(window.location.search);
            params.set('sala', salaAtual);
            params.set('uid', uidPersonagem);
            params.delete('nome');
            history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
        }

        function definirStatus(texto, tipo) {
            elements.status.textContent = texto;
            elements.status.className = `connection-status${tipo ? ' ' + tipo : ''}`;
        }

        function abrirConfiguracao() {
            elements.panel.classList.remove('hidden');
            elements.toggle.classList.remove('visible');
        }

        function fecharConfiguracao() {
            elements.panel.classList.add('hidden');
            elements.toggle.classList.add('visible');
        }
    </script>
</body>
</html>
