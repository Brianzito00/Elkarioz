<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay de Stream - RPG Total</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,600;1,400&family=Roboto:wght@700;900&display=swap');

        /* Fundo transparente essencial para o OBS */
        body {
            margin: 0;
            padding: 20px;
            background-color: transparent; 
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        .overlay-grid {
            display: none;
            grid-template-columns: repeat(2, minmax(480px, 500px));
            gap: 24px 34px;
            width: min(1034px, calc(100vw - 40px));
            align-items: center;
        }

        /* Container Principal */
        .widget-container {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            min-width: 0;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.5));
            transition: filter 0.35s ease;
        }

        .turn-indicator {
            position: absolute;
            z-index: 20;
            top: -10px;
            left: 148px;
            padding: 5px 12px;
            border: 2px solid #fff1a8;
            border-radius: 999px;
            background: linear-gradient(135deg, #6f4700, #d99a18);
            color: #fff9d9;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 1.4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transform: translateY(7px) scale(0.94);
            box-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 12px rgba(255,198,57,0.4);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
            pointer-events: none;
        }

        .widget-container.turno-ativo .turn-indicator {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s;
            animation: turnBadgePulse 1.8s ease-in-out infinite;
        }

        .widget-container.turno-ativo .avatar-box {
            border-color: #ffd45c;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 0 2px #fff1a8, 0 0 18px rgba(255,196,45,0.85);
            animation: turnAvatarGlow 1.8s ease-in-out infinite;
        }

        .widget-container.turno-ativo .combat-stats {
            filter: drop-shadow(0 0 5px rgba(255,210,82,0.35));
        }

        @keyframes turnAvatarGlow {
            0%, 100% { box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 0 2px #fff1a8, 0 0 12px rgba(255,196,45,0.55); }
            50% { box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 0 3px #fff6ca, 0 0 24px rgba(255,196,45,0.95); }
        }

        @keyframes turnBadgePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.18); }
        }

        /* Avatar do Personagem */
        .avatar-box {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #24185f;
            background-color: #1a1535;
            overflow: hidden;
            position: relative;
            z-index: 10; /* Fica por cima das barras */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 0 2px #000;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Container das 3 Barras */
        .bars-container {
            display: flex;
            flex-direction: column;
            margin-left: -20px; /* Puxa as barras para debaixo do avatar */
            z-index: 5;
            width: 360px;
        }

        /* Estilo base de todas as barras */
        .bar-row {
            border: 4px solid #000;
            border-left: none; /* A borda esquerda fica escondida no avatar */
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 0 4px 4px 0;
        }

        /* Barra do Topo (Nome e Nível) */
        .top-bar {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            background: transparent;
            height: 100px;
            justify-content: flex-start;
            align-items: center;
            padding: 0 18px 0 28px;
            border: none;
            border-radius: 0;
            clip-path: none;
            overflow: visible;
            box-sizing: border-box;
        }

        .identity-block {
            grid-area: 1 / 1;
            min-width: 0;
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s linear 0s;
            will-change: opacity, transform;
        }
        .identity-block.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s linear 0.45s;
        }

        .char-name {
            display: block;
            width: auto;
            max-width: 290px;
            font-family: 'Cinzel', serif;
            font-size: 2.15rem;
            font-weight: 900;
            line-height: 0.95;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: normal;
            overflow-wrap: anywhere;
            text-align: left;
            -webkit-text-stroke: 0.4px rgba(15, 18, 28, 0.75);
            text-shadow: 0 2px 3px rgba(0,0,0,0.8), 0 0 3px rgba(255,255,255,0.35);
            transform: rotate(-3deg);
        }

        .combat-stats {
            grid-area: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 0;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transform: translateY(5px);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s linear 0.45s;
            will-change: opacity, transform;
            pointer-events: none;
        }
        .combat-stats.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s linear 0s;
        }
        .combat-number {
            display: block;
            font-family: 'Lora', serif;
            font-size: 2.65rem;
            font-weight: 600;
            line-height: 0.94;
            letter-spacing: -1px;
            white-space: nowrap;
            color: #fff;
            text-shadow: 0 2px 3px #000;
        }
        .combat-number.hp {
            text-shadow: 0 2px 3px #000, 0 0 4px rgba(255,45,55,0.85), 0 0 9px rgba(255,45,55,0.42);
        }
        .combat-number.mp {
            text-shadow: 0 2px 3px #000, 0 0 4px rgba(45,110,255,0.85), 0 0 9px rgba(45,110,255,0.42);
        }

        /* Painel de conexao: usa a mesma paleta do overlay e some no modo de exibicao. */
        .connection-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            width: min(480px, calc(100vw - 40px));
            box-sizing: border-box;
            padding: 20px;
            border: 4px solid #000;
            border-radius: 10px;
            background: rgba(253, 251, 247, 0.97);
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
            color: #170f0a;
            font-family: 'Roboto', sans-serif;
        }

        .connection-panel.hidden { display: none; }
        .connection-title { margin: 0 0 5px; font-family: 'Cinzel', serif; font-size: 1.2rem; }
        .connection-help { margin: 0 0 15px; color: #5c3a21; font-size: 0.8rem; line-height: 1.4; }
        .connection-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        .connection-field { min-width: 0; }
        .connection-field.full { grid-column: 1 / -1; }
        .connection-field label { display: block; margin: 0 0 5px; font-family: 'Cinzel', serif; font-weight: 900; font-size: 0.72rem; }
        .connection-input, .connection-select {
            width: 100%;
            box-sizing: border-box;
            min-height: 42px;
            padding: 9px 11px;
            border: 2px solid #3e2723;
            border-radius: 5px;
            background: #fff;
            color: #170f0a;
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
        }
        .connection-button {
            align-self: end;
            min-height: 42px;
            padding: 9px 15px;
            border: 2px solid #000;
            border-radius: 5px;
            background: #b82326;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            cursor: pointer;
        }
        .connection-button:hover { filter: brightness(1.12); }
        .connection-button.secondary { background: #143d8d; }
        .connection-status {
            grid-column: 1 / -1;
            min-height: 18px;
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(0,0,0,0.08);
            font-size: 0.8rem;
            font-weight: 700;
        }
        .connection-status.ok { background: rgba(46,125,50,0.14); color: #1b5e20; }
        .connection-status.error { background: rgba(183,28,28,0.14); color: #8e1010; }
        .config-toggle {
            display: none;
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 101;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 2px solid #000;
            border-radius: 50%;
            background: rgba(253,251,247,0.92);
            color: #170f0a;
            cursor: pointer;
            font-size: 1rem;
        }
        .config-toggle.visible { display: block; }

        @media (max-width: 560px) {
            body { padding: 10px; }
            .connection-panel { top: 10px; left: 10px; width: calc(100vw - 20px); }
            .connection-grid { grid-template-columns: 1fr; }
            .connection-button { width: 100%; }
            .overlay-grid { width: calc(100vw - 20px); }
            .avatar-box { width: 105px; height: 105px; }
            .bars-container { width: calc(100% - 85px); }
            .char-name { font-size: 1.65rem; }
            .combat-number { font-size: 2.1rem; }
            .turn-indicator { left: 118px; }
        }

        @media (max-width: 1050px) {
            .overlay-grid { grid-template-columns: minmax(0, 500px); }
        }

    </style>
</head>
<body>

    <button type="button" class="config-toggle" id="config-toggle" aria-label="Configurar overlay" title="Configurar overlay">⚙</button>

    <section class="connection-panel" id="connection-panel" aria-label="Conexao do overlay">
        <h1 class="connection-title">CONECTAR OVERLAY</h1>
        <p class="connection-help">Informe a mesa e todos os personagens conectados aparecerão automaticamente na grade.</p>

        <div class="connection-grid">
            <div class="connection-field">
                <label for="mesa-input">MESA / UID DO MESTRE</label>
                <input class="connection-input" id="mesa-input" type="text" autocomplete="off" placeholder="EX: MESA1">
            </div>
            <button type="button" class="connection-button" id="connect-room-button">CONECTAR À MESA</button>

            <div class="connection-status" id="connection-status" role="status">Aguardando configuração.</div>
        </div>
    </section>

    <main class="overlay-grid" id="overlay-grid" aria-live="polite"></main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const elements = {
            panel: document.getElementById('connection-panel'),
            toggle: document.getElementById('config-toggle'),
            mesa: document.getElementById('mesa-input'),
            status: document.getElementById('connection-status'),
            grid: document.getElementById('overlay-grid')
        };

        let salaAtual = normalizarSala(urlParams.get('sala') || localStorage.getItem('overlaySala') || '');
        let jogadoresDaSala = {};
        let estadoTurno = { combateAtivo: false, idUnico: '', nome: '' };

        elements.mesa.value = salaAtual;

        document.getElementById('connect-room-button').addEventListener('click', () => conectarMesa(false));
        elements.mesa.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') conectarMesa(false);
        });
        elements.toggle.addEventListener('click', abrirConfiguracao);

        socket.on('connect', () => {
            if (salaAtual) conectarMesa(true);
            else definirStatus('Informe a mesa para começar.');
        });

        socket.on('disconnect', () => {
            definirStatus('Conexão com o servidor perdida. Tentando reconectar...', 'error');
        });

        socket.on('estadoSalaCompleto', function(jogadores) {
            jogadoresDaSala = jogadores && typeof jogadores === 'object' ? jogadores : {};
            renderizarGrade();
            solicitarTurnoAtual();
        });

        socket.on('atualizarDados', function(data) {
            if (!data || !data.uid || !data.dados || !salaAtual) return;
            if (normalizarSala(data.uid) !== salaAtual) return;

            const uidRecebido = normalizarUid(data.dados.idUnico);
            if (!uidRecebido) return;

            jogadoresDaSala[uidRecebido] = data.dados;
            renderizarGrade();
        });

        socket.on('player_kicked', function(payload) {
            if (!payload) return;
            if (payload.uidSala && normalizarSala(payload.uidSala) !== salaAtual) return;
            const uidRemovido = normalizarUid(payload.idUnico);
            if (!uidRemovido) return;
            delete jogadoresDaSala[uidRemovido];
            renderizarGrade();
        });

        socket.on('player_dice_roll', function(roll) {
            if (!roll || !salaAtual) return;
            if (roll.uid && normalizarSala(roll.uid) !== salaAtual) return;
            if (roll.categoria !== 'CONTROLE_TURNO') return;

            estadoTurno = {
                combateAtivo: roll.combateAtivo === true || roll.combateAtivo === 'true',
                idUnico: normalizarUid(roll.turnoIdUnico),
                nome: String(roll.turnoNome || '')
            };
            renderizarGrade();
        });

        function normalizarSala(valor) {
            return String(valor || '').trim().toUpperCase();
        }

        function normalizarUid(valor) {
            const somenteNumeros = String(valor || '').replace(/\D/g, '');
            return somenteNumeros.length === 4 ? somenteNumeros : '';
        }

        function conectarMesa(automatico) {
            const novaSala = normalizarSala(elements.mesa.value || salaAtual);
            if (!novaSala) {
                abrirConfiguracao();
                definirStatus('Digite o nome ou UID da mesa.', 'error');
                return;
            }

            salaAtual = novaSala;
            elements.mesa.value = salaAtual;
            jogadoresDaSala = {};
            estadoTurno = { combateAtivo: false, idUnico: '', nome: '' };
            elements.grid.innerHTML = '';
            elements.grid.style.display = 'none';
            localStorage.setItem('overlaySala', salaAtual);
            definirStatus(`Conectando à mesa ${salaAtual}...`);

            if (socket.connected) {
                socket.emit('solicitarEstadoSala', salaAtual);
                solicitarTurnoAtual();
            }
            else if (!automatico) definirStatus('Aguardando conexão com o servidor...', 'error');
        }

        function solicitarTurnoAtual() {
            if (!salaAtual || !socket.connected) return;
            socket.emit('player_dice_roll', {
                uid: salaAtual,
                idUnico: 'overlay',
                playerName: 'OVERLAY',
                nomeRolagem: 'Solicitar turno atual',
                categoria: 'SOLICITAR_TURNO_OVERLAY',
                _trigger: Math.random()
            });
        }

        function listarPersonagens() {
            return Object.entries(jogadoresDaSala)
                .map(([chave, dados]) => ({
                    uid: normalizarUid(dados && dados.idUnico) || normalizarUid(chave),
                    dados: dados || {}
                }))
                .filter(item => item.uid)
                .sort((a, b) => String(a.dados.charName || '').localeCompare(String(b.dados.charName || ''), 'pt-BR'));
        }

        function renderizarGrade() {
            const personagens = listarPersonagens();

            if (personagens.length === 0) {
                elements.grid.innerHTML = '';
                elements.grid.style.display = 'none';
                abrirConfiguracao();
                definirStatus(`Mesa ${salaAtual} conectada. Aguardando personagens...`, 'ok');
                return;
            }

            elements.grid.innerHTML = personagens.map(montarCardPersonagem).join('');
            elements.grid.style.display = 'grid';
            salvarConfiguracaoNaUrl();
            fecharConfiguracao();

            const quantidade = personagens.length;
            definirStatus(`${quantidade} ${quantidade === 1 ? 'personagem conectado' : 'personagens conectados'} na mesa ${salaAtual}.`, 'ok');
        }

        function montarCardPersonagem(item) {
            const p = item.dados;
            const uid = item.uid;
            const nome = String(p.charName || 'Sem nome');
            const imagem = p.img && String(p.img).trim() ? String(p.img) : 'https://via.placeholder.com/150';
            const modoCombate = p.modoCombate === true || p.modoCombate === 'true';
            const personagemDaVez = Boolean(
                modoCombate &&
                estadoTurno.combateAtivo &&
                estadoTurno.idUnico === uid
            );

            const hpAtual = numeroSeguro(p.hpAtual, 0);
            const hpMax = Math.max(0, numeroSeguro(p.hpMax, 0));
            const mpAtual = numeroSeguro(p.mpAtual, 0);
            const mpMax = Math.max(0, numeroSeguro(p.mpMax, 0));

            return `
                <article class="widget-container${personagemDaVez ? ' turno-ativo' : ''}" data-character-uid="${uid}" aria-label="${escapeHtml(nome)}">
                    <div class="turn-indicator" aria-hidden="${personagemDaVez ? 'false' : 'true'}">&#9876; SEU TURNO</div>
                    <div class="avatar-box">
                        <img src="${escapeHtml(imagem)}" alt="Avatar de ${escapeHtml(nome)}">
                    </div>
                    <div class="bars-container">
                        <div class="bar-row top-bar">
                            <div class="identity-block${modoCombate ? ' hidden' : ''}">
                                <span class="char-name">${escapeHtml(nome)}</span>
                            </div>
                            <div class="combat-stats${modoCombate ? ' active' : ''}" aria-label="Vida e mana de ${escapeHtml(nome)}">
                                <span class="combat-number hp">${hpAtual}/${hpMax}</span>
                                <span class="combat-number mp">${mpAtual}/${mpMax}</span>
                            </div>
                        </div>
                    </div>
                </article>`;
        }

        function escapeHtml(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, caractere => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[caractere]);
        }

        function numeroSeguro(valor, padrao) {
            const numero = Number.parseFloat(valor);
            return Number.isFinite(numero) ? numero : padrao;
        }

        function salvarConfiguracaoNaUrl() {
            const params = new URLSearchParams(window.location.search);
            params.set('sala', salaAtual);
            params.delete('uid');
            params.delete('nome');
            history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
        }

        function definirStatus(texto, tipo) {
            elements.status.textContent = texto;
            elements.status.className = `connection-status${tipo ? ' ' + tipo : ''}`;
        }

        function abrirConfiguracao() {
            elements.panel.classList.remove('hidden');
            elements.toggle.classList.remove('visible');
        }

        function fecharConfiguracao() {
            elements.panel.classList.add('hidden');
            elements.toggle.classList.add('visible');
        }
    </script>
</body>
</html>
